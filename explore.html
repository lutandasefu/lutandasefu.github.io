<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — Lutanda Sefu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="explore-page">

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>
  <canvas id="dot-grid"></canvas>

  <!-- NAVBAR -->
<nav id="custom-navbar">
  <ul>
    <li><a href="designs.html" class="nav-left">Projects</a></li>
    <li><a href="profile.html" class="nav-center">Lutanda Sefu</a></li>
  </ul>
</nav>

  <!-- SPLIT EXPLORE -->
  <div id="explore-split">

    <div class="split-panel" id="split-designs" onclick="window.location.href='designs.html'">
      <div class="split-content">
        <i class="ti ti-layout-grid split-icon"></i>
        <h2 class="split-title">Designs</h2>
        <p class="split-sub">View my work</p>
      </div>
    </div>

    <div id="split-middle">
      <a href="index.html" id="home-btn">
        <i class="ti ti-home"></i>
      </a>
    </div>

    <div class="split-panel" id="split-profile" onclick="window.location.href='profile.html'">
      <div class="split-content">
        <i class="ti ti-user split-icon"></i>
        <h2 class="split-title">Profile</h2>
        <p class="split-sub">About me</p>
      </div>
    </div>

  </div>

  <!-- BACK PILL -->
  <a href="javascript:history.back()" id="back-pill">
    <i class="ti ti-arrow-left"></i>
    <span>Back</span>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="script.js"></script>

</body>
</html>

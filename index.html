<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:'Sulphur Point',sans-serif;background:#e6e6e6;}

/* ---------- Sections ---------- */
section{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:transform 0.8s ease;}

/* ---------- Typing Intro ---------- */
#welcomeIntro{font-size:clamp(2rem,6vw,4rem);border-right:2px solid #111;animation:blink .7s step-end infinite;}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- Welcome ---------- */
#welcome{background:#e6e6e6;z-index:2;}
.welcome-text{margin-top:20px;font-size:clamp(2.2rem,6vw,4rem);text-align:center;}

/* ---------- Welcome Toggle ---------- */
.welcome-toggle{display:flex;flex-direction:column;gap:20px;margin-top:30px;}
.welcome-toggle button{width:70px;height:70px;border-radius:50%;border:2px solid #fff;background:#111;color:#fff;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;}
.welcome-toggle button:hover{transform:scale(1.1);}
.welcome-toggle svg{width:32px;height:32px;fill:white;}

/* ---------- Case/About Pages ---------- */
.page{background:#111;color:#fff;font-size:clamp(2rem,6vw,4rem);z-index:1;}
.page-text{cursor:pointer;margin-bottom:20px;position:relative;}
.page-horizontal{transform:translateX(100%);}
.page-horizontal.show{transform:translateX(0);}
.page-vertical{transform:translateY(100%);}
.page-vertical.show{transform:translateY(0);}

/* ---------- Case/About Toggle Right ---------- */
.iconToggle{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:none;z-index:2000;}
.switch{width:70px;height:150px;background:#fff;border-radius:45px;display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;border:2px solid #fff;}
.switch-focus{position:absolute;top:0;left:0;width:100%;height:50%;background:#000;border-radius:45px;transition:transform 0.3s;}
.switch-btn{border:none;background:transparent;color:black;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color 0.3s;}
.switch-btn svg{width:32px;height:32px;fill:black;transition:fill 0.3s;}
.switch-btn.active svg{fill:white;}

/* ---------- Carousel ---------- */
.carousel{display:none;margin-top:20px;width:90%;max-width:600px;overflow:hidden;border-radius:15px;position:relative;}
.carousel-track{display:flex;transition:transform 0.5s ease-in-out;}
.carousel-item{min-width:100%;flex-shrink:0;background:#222;color:#fff;display:flex;justify-content:center;align-items:center;height:200px;border-radius:10px;font-size:1.5rem;}
.carousel-nav{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;transform:translateY(-50%);padding:0 15px;}
.carousel-nav button{background:rgba(0,0,0,0.2);border:none;color:#fff;font-size:2rem;border-radius:50%;cursor:pointer;}

@media(max-width:600px){
  .iconToggle{right:15px;}.switch{width:55px;height:120px;}.switch-btn svg{width:24px;height:24px;}.carousel-item{height:150px;font-size:1.2rem;}
  .welcome-toggle button{width:55px;height:55px;}
}
</style>
</head>
<body>

<!-- Welcome Section -->
<section id="welcome">
  <div id="welcomeIntro"></div>
  <div class="welcome-text">Welcome to my portfolio</div>
  <div class="welcome-toggle">
    <button id="welcomeCaseIcon" title="Case Studies">
      <svg viewBox="0 0 24 24"><path d="M3 4H21V20H3V4ZM5 6V18H19V6H5ZM7 8H17V10H7V8ZM7 12H17V14H7V12Z"/></svg>
    </button>
    <button id="welcomeAboutIcon" title="About">
      <svg viewBox="0 0 24 24"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM12 14C8.13 14 2 16.17 2 20V22H22V20C22 16.17 15.87 14 12 14Z"/></svg>
    </button>
  </div>
</section>

<!-- Case/About Toggle -->
<div class="iconToggle" id="iconToggle">
  <div class="switch">
    <div class="switch-focus" id="switchFocus"></div>
    <button class="switch-btn" id="caseIcon" title="Case Studies">
      <svg viewBox="0 0 24 24"><path d="M3 4H21V20H3V4ZM5 6V18H19V6H5ZM7 8H17V10H7V8ZM7 12H17V14H7V12Z"/></svg>
    </button>
    <button class="switch-btn" id="aboutIcon" title="About">
      <svg viewBox="0 0 24 24"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM12 14C8.13 14 2 16.17 2 20V22H22V20C22 16.17 15.87 14 12 14Z"/></svg>
    </button>
  </div>
</div>

<!-- Case Page -->
<section id="case" class="page page-horizontal">
  <div class="page-text" id="caseText">Case Studies</div>
</section>

<!-- About Page -->
<section id="about" class="page page-horizontal">
  <div class="page-text">About</div>
</section>

<script>
document.addEventListener("DOMContentLoaded",function(){

// ---------- Typing Intro ----------
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("welcomeIntro");
function type(){if(c<lines[l].length){intro.textContent+=lines[l][c++];setTimeout(type,90);}else{if(l<lines.length-1){setTimeout(erase,600);}else{return;}}}
function erase(){if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}else{l++;type();}}
type();

// ---------- Welcome toggle ----------
const wCase=document.getElementById("welcomeCaseIcon");
const wAbout=document.getElementById("welcomeAboutIcon");
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const iconToggle=document.getElementById("iconToggle");
const switchFocus=document.getElementById("switchFocus");
const caseIcon=document.getElementById("caseIcon");
const aboutIcon=document.getElementById("aboutIcon");

function slideWelcome(targetPage){
  document.getElementById("welcome").style.transform="translateY(-100%)";
  setTimeout(()=>{
    targetPage.classList.add("show");
    iconToggle.style.display="block";
    if(targetPage===casePage){setActiveToggle("case");}else{setActiveToggle("about");}
  },800);
}

wCase.onclick=()=>slideWelcome(casePage);
wAbout.onclick=()=>slideWelcome(aboutPage);

// ---------- Case/About toggle ----------
function setActiveToggle(active){
  if(active==="case"){switchFocus.style.transform="translateY(0)";caseIcon.classList.add("active");aboutIcon.classList.remove("active");}
  else{switchFocus.style.transform="translateY(100%)";caseIcon.classList.remove("active");aboutIcon.classList.add("active");}
}

caseIcon.onclick=()=>{showPage(casePage,"horizontal");setActiveToggle("case");}
aboutIcon.onclick=()=>{showPage(aboutPage,"horizontal");setActiveToggle("about");}

function showPage(page,dir){
  page.classList.add("show");
  if(page===casePage){aboutPage.classList.remove("show");}else{casePage.classList.remove("show");}
}

// ---------- Carousel ----------
const caseText=document.getElementById("caseText");
const carousel=document.createElement("div");carousel.className="carousel";
carousel.innerHTML=`
<div class="carousel-track">
  <div class="carousel-item">Project 1</div>
  <div class="carousel-item">Project 2</div>
  <div class="carousel-item">Project 3</div>
</div>
<div class="carousel-nav">
  <button class="prev">&#10094;</button>
  <button class="next">&#10095;</button>
</div>`;
caseText.appendChild(carousel);

const track=carousel.querySelector(".carousel-track");
const items=carousel.querySelectorAll(".carousel-item");
let index=0;
const prev=carousel.querySelector(".prev");
const next=carousel.querySelector(".next");

caseText.addEventListener("mouseenter",()=>carousel.style.display="block");
caseText.addEventListener("mouseleave",()=>carousel.style.display="none");
prev.onclick=()=>{index=(index-1+items.length)%items.length;track.style.transform=`translateX(-${index*100}%)`;}
next.onclick=()=>{index=(index+1)%items.length;track.style.transform=`translateX(-${index*100}%)`;}

});
</script>
</body>
</html>

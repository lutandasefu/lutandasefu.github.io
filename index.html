<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnifying Glass Text</title>

  <!-- Outfit Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000; /* black background */
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    .text-container {
      position: relative;
      font-size: 4rem;
      color: #fff;
      letter-spacing: 0.2rem;
      cursor: none; /* hide default cursor */
      user-select: none;
    }

    /* Each letter as a span */
    .letter {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    /* Magnifier overlay */
    .magnifier {
      position: absolute;
      pointer-events: none; /* so it doesn't block hover */
      border-radius: 50%;
      border: 2px solid #fff;
      width: 150px;
      height: 150px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .magnifier span {
      position: relative;
      display: inline-block;
      font-size: 4rem;
      color: #fff;
      transform-origin: center center;
      transition: transform 0.1s ease;
    }

  </style>
</head>
<body>

  <div class="text-container" id="textContainer">
    <!-- Letters injected via JS -->
  </div>

  <!-- Magnifier circle -->
  <div class="magnifier" id="magnifier">
    <div id="magnifiedText"></div>
  </div>

  <script>
    const text = "INTERACTIVE DESIGNER";
    const container = document.getElementById('textContainer');
    const magnifier = document.getElementById('magnifier');
    const magnifiedText = document.getElementById('magnifiedText');

    // Inject letters into main text and magnified text
    for (let i = 0; i < text.length; i++) {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
      container.appendChild(span);

      const mspan = document.createElement('span');
      mspan.textContent = text[i] === ' ' ? '\u00A0' : text[i];
      magnifiedText.appendChild(mspan);
    }

    const letters = container.querySelectorAll('.letter');
    const mLetters = magnifiedText.querySelectorAll('span');

    // Track mouse for magnifier
    document.addEventListener('mousemove', e => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX;
      const y = e.clientY;

      // Move magnifier
      magnifier.style.left = x + 'px';
      magnifier.style.top = y + 'px';

      // Check each letter
      letters.forEach((letter, i) => {
        const lRect = letter.getBoundingClientRect();
        const mLetter = mLetters[i];

        // Distance from mouse to letter center
        const cx = lRect.left + lRect.width/2;
        const cy = lRect.top + lRect.height/2;
        const dx = x - cx;
        const dy = y - cy;
        const distance = Math.sqrt(dx*dx + dy*dy);

        // Apply scale inside magnifier radius
        const radius = 75; // half magnifier width
        if (distance < radius) {
          const scale = 1 + (radius - distance)/radius * 1.5; // max scale 2.5
          mLetter.style.transform = `scale(${scale})`;
        } else {
          mLetter.style.transform = 'scale(1)';
        }
      });

      // Position magnified text inside magnifier
      const offsetX = -x + magnifier.offsetWidth/2;
      const offsetY = -y + magnifier.offsetHeight/2;
      magnifiedText.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    });
  </script>

</body>
</html>

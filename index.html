<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutanda | UI/UX Portfolio</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sulphur Point', sans-serif;
      background: #ddd;
      color: #333;
      scroll-behavior: smooth;
    }

    /* HERO */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 5rem;
      font-weight: 300;
      border-right: 2px solid #333;
      white-space: nowrap;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    @keyframes blink {
      0%, 50%, 100% { border-color: #333; }
      25%, 75% { border-color: transparent; }
    }

    .typing {
      animation: blink 0.7s step-end infinite;
    }

    .cursor-end {
      animation: blink 0.7s step-end 3;
    }

    .fade-up-out {
      opacity: 0;
      transform: translateY(-80px);
    }

    /* NEXT SECTION */
    .next-section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.5rem;
      background: #bbb;

      opacity: 0;
      transform: translateY(80px);
      transition: opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .next-section.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      h1 { font-size: 4rem; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1 id="intro" class="typing"></h1>
  </section>

  <section class="next-section" id="next">
    Welcome to my portfolio
  </section>

  <script>
    const sentences = [
      "Hey, I'm Lutanda",
      "A UI/UX designer",
      "I design for clarity",
      "And purpose."
    ];

    const introEl = document.getElementById("intro");
    const nextSection = document.getElementById("next");

    let sentenceIndex = 0;
    let charIndex = 0;

    const baseTypingSpeed = 120;
    const erasingSpeed = 70;
    const delayBetween = 1500;

    function randomSpeed() {
      return baseTypingSpeed + Math.random() * 40;
    }

    function typeSentence() {
      if (charIndex < sentences[sentenceIndex].length) {
        introEl.textContent += sentences[sentenceIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeSentence, randomSpeed());
      } else {
        if (sentenceIndex < sentences.length - 1) {
          setTimeout(eraseSentence, delayBetween);
        } else {
          // Final sequence
          introEl.classList.remove("typing");
          introEl.classList.add("cursor-end");

          setTimeout(() => {
            introEl.classList.add("fade-up-out");

            setTimeout(() => {
              nextSection.scrollIntoView({ behavior: "smooth" });

              setTimeout(() => {
                nextSection.classList.add("reveal");
              }, 600);

            }, 1200);

          }, 2100); // 3 cursor blinks
        }
      }
    }

    function eraseSentence() {
      if (charIndex > 0) {
        introEl.textContent = sentences[sentenceIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseSentence, erasingSpeed);
      } else {
        sentenceIndex++;
        setTimeout(typeSentence, randomSpeed());
      }
    }

    window.onload = () => typeSentence();
  </script>

</body>
</html>

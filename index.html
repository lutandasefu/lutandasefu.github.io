<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#e6e6e6;font-family:'Sulphur Point',sans-serif;transition:background .6s ease;}
section{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;text-align:center;}

/* ---------- INTRO ---------- */
#intro{font-size:clamp(2rem,6vw,4.2rem);border-right:2px solid #111;animation:blink .7s step-end infinite;}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME ---------- */
.welcome{flex-direction:column;gap:35px;font-size:clamp(2.2rem,6vw,4.4rem);opacity:0;transition:opacity .8s ease;}

/* ---------- CODEPEN‑STYLE TOGGLE ---------- */
.toggleWrapper {
  margin-top:20px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.toggleSwitch {
  position: relative;
  width: 260px;
  height: 60px;
  background: #fff;
  border-radius: 50px;
  border: 2px solid #ccc;
  display: flex;
  cursor: pointer;
  transition: 0.4s ease;
}

.toggleSwitch input {
  display:none;
}

.toggleKnob {
  position:absolute;
  top:5px;
  left:5px;
  width:120px;
  height:50px;
  background:#111;
  border-radius:45px;
  transition:0.4s ease;
}

.option {
  flex:1;
  z-index:1;
  text-align:center;
  line-height:60px;
  font-family:'Urbanist',sans-serif;
  font-size:1.1rem;
  color:#444;
  user-select:none;
}

.toggleSwitch input:checked + .toggleKnob {
  transform:translateX(130px);
}

.toggleSwitch input:checked ~ .option.caseLabel {
  color:#fff;
}

.toggleSwitch input:not(:checked) ~ .option.aboutLabel {
  color:#fff;
}

/* ---------- PAGES ---------- */
.page{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#111;color:#fff;font-size:clamp(2rem,6vw,4rem);transform:translateX(100%);transition:transform .8s ease;z-index:1000;}

</style>
</head>
<body>

<!-- Phase 1: Intro -->
<section id="hero"><div id="intro"></div></section>

<!-- Phase 2: Welcome -->
<section class="welcome" id="welcome">
  <div>Welcome to my portfolio</div>

  <div class="toggleWrapper">
    <label class="toggleSwitch">
      <input type="checkbox" id="welcomeToggle">
      <div class="toggleKnob"></div>
      <div class="option caseLabel">Case Studies</div>
      <div class="option aboutLabel">About</div>
    </label>
  </div>
</section>

<script>
// ---------- Intro Typing ----------
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");
function type(){ if(c<lines[l].length){intro.textContent+=lines[l][c++]; setTimeout(type,90);} else{ if(l<lines.length-1){setTimeout(erase,600);} else{setTimeout(showWelcome,500);} }}
function erase(){ if(c>0){intro.textContent=lines[l].substring(0,--c); setTimeout(erase,40);} else{l++; type();}}
function showWelcome(){
  document.getElementById("hero").remove();
  document.getElementById("welcome").style.opacity=1;
}
window.onload=type;

// ---------- Welcome Toggle Interaction ----------
document.getElementById("welcomeToggle").addEventListener("change",function(){
  // slight delay so animation completes
  setTimeout(() => {
    const mode = this.checked ? "About" : "Case Studies";
    document.getElementById("welcome").remove();
    document.body.style.background="#111";
    createPage(mode);
  }, 300);
});

let currentPage=null;
function createPage(title){
  if(currentPage) currentPage.remove();
  const p=document.createElement("section");
  p.className="page";
  p.textContent=title;
  document.body.appendChild(p);
  setTimeout(()=>p.style.transform="translateX(0)",50);
}
</script>

</body>
</html>

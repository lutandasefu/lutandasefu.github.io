<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Studies Interaction</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  background:#111;
  font-family:'Sulphur Point', sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#fff;
}

/* Container */
.case-container{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
}

/* Title */
.case-title{
  font-size:clamp(2rem,4vw,3rem);
  cursor:pointer;
  z-index:2;
  transition:opacity .4s ease;
}

/* Horizontal blocks */
.hover-grid{
  position:absolute;
  display:flex;
  gap:8px;
  opacity:0;
  pointer-events:none;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  transition:opacity .4s ease;
}

/* Show blocks + hide title */
.case-container:hover .hover-grid{
  opacity:1;
  pointer-events:auto;
}

.case-container:hover .case-title{
  opacity:0;
}

/* Rectangles */
.hover-grid div{
  height:140px;
  width:60px;
  transition:width .4s ease;
  border-radius:6px;
}

/* Expand sideways */
.hover-grid div:hover{
  width:200px;
}

/* Demo colors */
.hover-grid div:nth-child(1){background:#e74c3c;}
.hover-grid div:nth-child(2){background:#3498db;}
.hover-grid div:nth-child(3){background:#2ecc71;}
.hover-grid div:nth-child(4){background:#f1c40f;}
.hover-grid div:nth-child(5){background:#9b59b6;}
.hover-grid div:nth-child(6){background:#e67e22;}
</style>
</head>

<body>

<div class="case-container">
  <h2 class="case-title">Case Studies</h2>

  <div class="hover-grid">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutanda Sefu — Digital Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav id="custom-navbar">
    <a href="#uiux" class="nav-left">UI/UX Design</a>
    <a href="index.html" class="nav-center">Lutanda Sefu</a>
    <a href="#graphic" class="nav-right">Graphic Design</a>
  </nav>

  <!-- HERO -->
  <div id="hero-container">
    <div id="typing-container">
      <span id="typing-text"></span><span id="cursor">|</span>
    </div>
    <h1 id="hero-heading">Digital Designer</h1>
    <div id="toggle-container">
      <span class="toggle-label">UI/UX</span>
      <label class="switch">
        <input type="checkbox" id="designToggle">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Graphic Design</span>
    </div>
  </div>

  <script>
    (function() {
      var text = "Hi, I'm Lutanda Sefu, welcome to my portfolio";
      var typingElement = document.getElementById("typing-text");
      var cursor = document.getElementById("cursor");
      var toggle = document.getElementById("toggle-container");
      var index = 0;
      var typingSpeed = 80;

      function type() {
        if (index < text.length) {
          typingElement.textContent += text.charAt(index);
          index++;
          setTimeout(type, typingSpeed);
        } else {
          cursor.style.animation = "blink 1s infinite";
          setTimeout(function() {
            toggle.classList.add("visible");
          }, 500);
        }
      }

      setTimeout(type, 500);
    })();
  </script>

</body>
</html>

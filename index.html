<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Studies Interaction</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#111;
  font-family:'Sulphur Point', sans-serif;
  color:#fff;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- CASE CONTAINER ---------- */
.case-container{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Title */
.case-title{
  font-size:clamp(2rem,4vw,3rem);
  cursor:pointer;
  z-index:2;
  transition:opacity .4s ease;
}

/* Grid */
.hover-grid{
  position:absolute;
  display:flex;
  gap:8px;
  opacity:0;
  pointer-events:none;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  transition:opacity .4s ease;
}

/* Show grid / hide title */
.case-container:hover .hover-grid{
  opacity:1;
  pointer-events:auto;
}

.case-container:hover .case-title{
  opacity:0;
}

/* Rows */
.row{
  height:160px;
  width:60px;
  border-radius:6px;
  transition:width .35s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}

/* Demo colors */
.row:nth-child(1){background:#e74c3c;}
.row:nth-child(2){background:#3498db;}
.row:nth-child(3){background:#2ecc71;}
.row:nth-child(4){background:#f1c40f;}
.row:nth-child(5){background:#9b59b6;}
.row:nth-child(6){background:#e67e22;}
</style>
</head>

<body>

<section class="case-container">
  <h2 class="case-title">Case Studies</h2>

  <div class="hover-grid" id="hoverGrid">
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
  </div>
</section>

<script>
const grid = document.getElementById('hoverGrid');
const rows = [...grid.children];

grid.addEventListener('mousemove', e => {
  rows.forEach(row => {
    const rect = row.getBoundingClientRect();
    const center = rect.left + rect.width / 2;
    const distance = Math.abs(e.clientX - center);

    const influence = 300;
    const expand = Math.max(0, influence - distance) / influence;
    const width = 60 + expand * 180;

    row.style.width = width + 'px';
  });
});

grid.addEventListener('mouseleave', () => {
  rows.forEach(r => r.style.width = '60px');
});
</script>

</body>
</html>

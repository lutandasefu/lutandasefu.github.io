<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@100;300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  background:#e6e6e6;
  font-family:'Sulphur Point',sans-serif;
}

/* ---------- TRUE 3D PERSPECTIVE (THE MISSING PIECE) ---------- */
#app{
  perspective:1000px;
}

/* ---------- INTRO ---------- */
section{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;}
#intro{
  font-size:4.2rem;
  border-right:2px solid #111;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME ---------- */
.welcome{
  flex-direction:column;
  gap:40px;          /* less space between text and menu */
  font-size:4.4rem;  /* slightly bigger welcome text */
  opacity:0;
  transition:opacity .8s ease;
}

/* ---------- DEV LOOP MENU ---------- */
#app ul{
  position:relative;
  width:520px;
  height:70px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-radius:45px;
  background:#fff;
  transform-style:preserve-3d;
  overflow:hidden;
}

#app li{
  list-style:none;
  display:grid;
  place-items:center;
  font-family:'Urbanist',sans-serif;
  font-weight:300;
  font-size:1.2rem;
  color:#666;
  cursor:pointer;
  z-index:10;
}

.focus-el{
  position:absolute;
  left:0;
  top:0;
  width:50%;
  height:100%;
  border-radius:45px;
  background:#f2f2f2;
}

/* ---------- DARK ICON TOGGLE ---------- */
.iconMode{
  position:fixed;
  right:40px;
  top:50%;
  transform:translateY(-50%);
  display:none;
  flex-direction:column;
  gap:30px;
  z-index:2000;
}
.iconMode button{
  width:70px;height:70px;border-radius:50%;
  border:2px solid #fff;background:#111;color:#fff;
  font-size:1.6rem;cursor:pointer;
}

/* ---------- DARK PAGE ---------- */
.page{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:#111;color:#fff;
  font-size:4rem;
  transform:translateX(100%);
  transition:transform .8s ease;
}
</style>
</head>
<body>

<!-- Intro -->
<section id="hero">
  <div id="intro"></div>
</section>

<!-- Welcome -->
<section class="welcome" id="welcome">
  <div>Welcome to my portfolio</div>

  <div id="app">
    <ul>
      <li data-page="Case Studies">Case Studies</li>
      <li data-page="About">About</li>
      <span class="focus-el"></span>
    </ul>
  </div>
</section>

<!-- Dark icon toggle -->
<div class="iconMode" id="iconMode">
  <button id="darkCase"><i class="far fa-file-lines"></i></button>
  <button id="darkAbout"><i class="fas fa-user"></i></button>
</div>

<script>
/* ---------- TYPE EFFECT ---------- */
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,90);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,300);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}
function showWelcome(){
 document.getElementById("hero").remove();
 document.getElementById("welcome").style.opacity=1;
}

/* ---------- DEV LOOP MENU (FIXED) ---------- */
const liEls=[...document.querySelectorAll("#app li")];
const slideEl=document.querySelector(".focus-el");
const liContainer=document.querySelector("#app ul");

let activeIndex=-1; // FIX

liEls.forEach((li,index)=>{
 li.addEventListener("click",()=>{
   const x=index===0?-1:1;
   const liRect=li.getBoundingClientRect();
   const parentRect=liContainer.getBoundingClientRect();

   gsap.to(liContainer,{duration:0.4,rotateY:`${x*25}deg`});
   gsap.to(slideEl,{
     duration:0.7,
     left:`${liRect.left-parentRect.left}px`,
     ease:"bounce.out"
   });
   gsap.to(liContainer,{duration:0.4,rotateY:"0deg",delay:0.3});

   activeIndex=index;

   // INSTANT PAGE CHANGE (no lag)
   goToDarkPage(li.dataset.page);
 });
});

/* ---------- DARK PAGE SYSTEM ---------- */
let currentPage=null;
const iconMode=document.getElementById("iconMode");

function goToDarkPage(title){
 document.body.style.background="#111";
 document.getElementById("welcome").remove();
 iconMode.style.display="flex";
 createPage(title);
}

function createPage(title){
 if(currentPage) currentPage.remove();
 const p=document.createElement("section");
 p.className="page";
 p.textContent=title;
 document.body.appendChild(p);
 setTimeout(()=>{p.style.transform="translateX(0%)";},50);
 currentPage=p;
}

document.getElementById("darkCase").onclick=()=>createPage("Case Studies");
document.getElementById("darkAbout").onclick=()=>createPage("About");

window.onload=type;
</script>

</body>
</html>

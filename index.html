<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{font-family:'Sulphur Point',sans-serif;background:#111;}

/* ---------- CINEMATIC INTRO ---------- */
#intro{
  position:fixed;
  inset:0;
  background:#111;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-left:10vw;
  gap:2.5rem;
  z-index:6;
  perspective:1000px;
  overflow:hidden;
}

.intro-line{
  opacity:0;
  transform:translateY(40px);
  transition:all 1.2s cubic-bezier(.19,1,.22,1);
  font-family:'Urbanist',sans-serif;
  color:#fff;
  will-change: transform, opacity;
}

#l1{ font-size:clamp(3rem,7vw,6rem); }
#l2{ 
  font-size:clamp(2.2rem,5vw,3.5rem);
  margin-left:10vw;
  background: linear-gradient(90deg,#FF8A00,#E52E71);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#l3{ 
  font-size:clamp(1.6rem,3vw,2.2rem);
  line-height:1.6;
  margin-left:5vw;
}

#intro.exit{
  transform: scale(0.96) rotateX(3deg);
  opacity:0;
  transition: transform 1.4s cubic-bezier(.22,1,.36,1), opacity 1.2s ease;
}

/* ---------- WELCOME ---------- */
#welcome{
  position:fixed;
  inset:0;
  display:flex; 
  flex-direction:column;
  justify-content:center; 
  align-items:center;
  opacity:0;
  transition:opacity .8s ease, transform .8s ease;
  z-index:4;
  background:#e6e6e6;
}
#welcome div{
  margin-bottom:30px;
  font-size:clamp(3rem,6vw,5rem);
  color:#111;
  text-align:center;
  font-weight:500;
}

/* ---------- WELCOME TOGGLE ---------- */
#welcome-toggle{
  display:flex;
  position:relative;
  width:190px; height:60px;
  background:#fff;
  border-radius:50px;
  border:2px solid #fff;
}
#welcome-toggle .focus{
  position:absolute; top:6px; left:6px;
  width:78px; height:48px; border-radius:50px;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
#welcome-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
  padding:0;
}
#welcome-toggle button svg{
  width:24px; height:24px;
  stroke:#111;
  fill:none;
  transition:stroke .3s ease;
}
#welcome-toggle button.active svg *{
  stroke:#fff !important;
}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed;
  right:30px; top:50%;
  transform:translateY(-50%);
  width:75px; height:160px;
  background:#fff;
  border-radius:45px;
  display:none;
  flex-direction:column;
  border:2px solid #fff;
  z-index:10;
}
.right-toggle .right-focus{
  position:absolute; top:0; left:0;
  width:100%; height:50%;
  background:#111;
  border-radius:45px;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
.right-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}
.right-toggle button svg{
  width:28px;
  height:28px;
  transform:translateY(2px);
  stroke:#111;
  fill:none;
}
.right-toggle button.active svg{
  stroke:#fff;
}

/* ---------- PAGES ---------- */
.page{
  position:fixed;
  inset:0;
  background:#111; 
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(2rem,5vw,3rem);
  transform:translateX(100%);
  transition:.8s cubic-bezier(.77,0,.18,1);
  z-index:3;
  backface-visibility:hidden;
}

/* ---------- CAROUSEL ---------- */
.carousel{
  position:absolute;
  bottom:10%; width:80%; height:200px;
  opacity:0; transform:scale(.8);
  transition:.5s ease;
  display:flex; gap:20px; justify-content:center;
}
.carousel img{
  width:200px; height:120px;
  object-fit:cover;
  border-radius:12px;
}
.showCarousel{
  opacity:1;
  transform:scale(1);
}
</style>
</head>

<body class="grey-bg">

<!-- ---------- CINEMATIC INTRO ---------- -->
<section id="intro">
  <canvas id="introCanvas"></canvas>
  <div class="intro-line" id="l1">Hi, I’m Lutanda</div>
  <div class="intro-line" id="l2">A UI/UX Designer</div>
  <div class="intro-line" id="l3">
    Designing for clarity<br>and purpose.
  </div>
</section>

<!-- ---------- WELCOME ---------- -->
<section id="welcome">
  <div>Welcome to my portfolio</div>
  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>
    <button id="toCase">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>
    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<!-- ---------- PAGES ---------- -->
<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>
  <div class="carousel" id="carousel">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>
</section>

<section id="about" class="page">About</section>

<!-- ---------- RIGHT TOGGLE ---------- -->
<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>
  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
// ---------- PARTICLE BACKGROUND ----------
const canvas = document.getElementById('introCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = Array.from({length:50}, ()=>{
  return {x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*3+1, dx:(Math.random()-0.5)*0.3, dy:(Math.random()-0.5)*0.3};
});

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.fill();
    p.x += p.dx;
    p.y += p.dy;
    if(p.x<0)p.x=canvas.width;
    if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;
    if(p.y>canvas.height)p.y=0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// ---------- LINES ----------
const l1 = document.getElementById("l1");
const l2 = document.getElementById("l2");
const l3 = document.getElementById("l3");
const intro = document.getElementById("intro");
const welcome = document.getElementById("welcome");

function animateLine(line, delay, offset=40){
  line.style.transition='none';
  line.style.transform=`translateY(${offset}px)`;
  setTimeout(()=>{
    line.style.transition='transform 1s cubic-bezier(.22,1,.36,1), opacity 1s ease';
    line.style.transform='translateY(0)';
    line.style.opacity=1;
  },delay);
}

// Springy layered animation
animateLine(l1,400);
animateLine(l2,1400,60);
animateLine(l3,2600,80);

// Cursor parallax
document.addEventListener('mousemove', e=>{
  const x=(e.clientX/window.innerWidth-0.5)*30;
  const y=(e.clientY/window.innerHeight-0.5)*30;
  l1.style.transform=`translateY(0) rotateY(${x*0.3}deg) rotateX(${y*0.3}deg)`;
  l2.style.transform=`translateY(0) translateX(2vw) rotateY(${x*0.5}deg) rotateX(${y*0.5}deg)`;
  l3.style.transform=`translateY(0) translateX(4vw) rotateY(${x*0.7}deg) rotateX(${y*0.7}deg)`;
});

// Micro flourish on final line
setTimeout(()=>{
  l3.style.transition='transform 0.6s cubic-bezier(.22,1,.36,1)';
  l3.style.transform='translateY(0) translateX(4vw) scale(1.03)';
  setTimeout(()=> l3.style.transform='translateY(0) translateX(4vw) scale(1)',600);
},4000);

// Exit intro to welcome
setTimeout(()=>{
  intro.classList.add("exit");
  setTimeout(()=>{ intro.remove(); welcome.style.opacity=1; },1400);
},5200);

// ---------- NAVIGATION ----------
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const right=document.getElementById("rightToggle");
const rFocus=document.getElementById("rFocus");
const wFocus=document.getElementById("wFocus");

const caseBtn=document.getElementById("caseBtn");
const aboutBtn=document.getElementById("aboutBtn");
const toCase=document.getElementById("toCase");
const toAbout=document.getElementById("toAbout");

toCase.classList.add("active");

function setWelcomeActive(activeBtn,inactiveBtn){
  wFocus.style.transform=activeBtn===toCase?"translateX(0)":"translateX(100%)";
  activeBtn.classList.add("active");
  inactiveBtn.classList.remove("active");
}

function activateBlackBg(){
  document.body.classList.remove("grey-bg");
  document.body.classList.add("black-bg");
}

function showCase(){
  activateBlackBg();
  casePage.style.transform="translateX(0)";
  aboutPage.style.transform="translateX(100%)";
  rFocus.style.transform="translateY(0)";
  caseBtn.classList.add("active");
  aboutBtn.classList.remove("active");
}

function showAbout(){
  activateBlackBg();
  aboutPage.style.transform="translateX(0)";
  casePage.style.transform="translateX(-100%)";
  rFocus.style.transform="translateY(100%)";
  aboutBtn.classList.add("active");
  caseBtn.classList.remove("active");
}

toCase.onclick=()=>{setWelcomeActive(toCase,toAbout); welcome.style.transform="translateY(-100%)"; right.style.display="flex"; showCase();}
toAbout.onclick=()=>{setWelcomeActive(toAbout,toCase); welcome.style.transform="translateY(-100%)"; right.style.display="flex"; showAbout();}

caseBtn.onclick=showCase;
aboutBtn.onclick=showAbout;

// ---------- CAROUSEL HOVER ----------
const title=document.getElementById("caseTitle");
const carousel=document.getElementById("carousel");

title.onmouseenter=()=>carousel.classList.add("showCarousel");
title.onmouseleave=()=>carousel.classList.remove("showCarousel");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/6b8b2c6e52.js" crossorigin="anonymous"></script>

<style>
/* ---------- GENERAL ---------- */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  background:#e6e6e6;
  font-family:'Sulphur Point',sans-serif;
  transition:background .6s ease;
}

/* ---------- INTRO ---------- */
section{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
}
#intro{
  font-size:clamp(2rem,6vw,4.2rem);
  border-right:2px solid #111;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME ---------- */
.welcome{
  flex-direction:column;
  gap:35px;
  font-size:clamp(2.2rem,6vw,4.4rem);
  opacity:0;
  transition:opacity .8s ease;
}

/* ---------- MENU ---------- */
.menu{
  width:90%;
  max-width:520px;
  height:70px;
  background:#fff;
  border-radius:45px;
  position:relative;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  overflow:hidden;
  font-family:'Urbanist',sans-serif;
}
.menu div{
  display:grid;
  place-items:center;
  font-size:clamp(1rem,2.5vw,1.2rem);
  color:#666;
  cursor:pointer;
  z-index:2;
}
.focus{
  position:absolute;
  left:0;
  top:0;
  width:50%;
  height:100%;
  background:#f2f2f2;
  border-radius:45px;
  transition:transform .6s cubic-bezier(.77,0,.18,1);
}

/* ---------- TOGGLE ---------- */
.iconToggle{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  display:flex; /* exists from start */
  flex-direction:column;
  gap:25px;
  z-index:2000;
  opacity:0; /* hidden initially */
  transition:opacity .6s ease, top .6s ease, transform .6s ease;
}
.iconToggle button{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid #fff;
  background:#111;
  color:#fff;
  font-size:1.5rem;
  cursor:pointer;
}

/* ---------- PAGE ---------- */
.page{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  color:#fff;
  font-size:clamp(2rem,6vw,4rem);
  transform:translateX(100%);
  transition:transform .8s ease;
  z-index:1000;
  flex-direction:column;
}

/* ---------- CAROUSEL ---------- */
.carousel{
  display:none; /* hidden initially */
  margin-top:40px;
  width:90%;
  max-width:600px;
  overflow:hidden;
  border-radius:15px;
  position:relative;
}
.carousel-track{
  display:flex;
  transition:transform 0.5s ease-in-out;
}
.carousel-item{
  min-width:100%;
  flex-shrink:0;
  background:#222;
  color:#fff;
  font-size:1.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
  height:200px;
  border-radius:10px;
}
.carousel-nav{
  position:absolute;
  top:50%;
  width:100%;
  display:flex;
  justify-content:space-between;
  transform:translateY(-50%);
  padding:0 15px;
}
.carousel-nav button{
  background:rgba(255,255,255,0.3);
  border:none;
  color:#fff;
  font-size:2rem;
  border-radius:50%;
  cursor:pointer;
}

/* ---------- MOBILE ---------- */
@media(max-width:600px){
  .iconToggle{right:15px;}
  .iconToggle button{width:55px;height:55px;font-size:1.2rem;}
  .menu{height:60px;}
  .carousel-item{height:150px;font-size:1.2rem;}
}
</style>
</head>
<body>

<!-- Phase 1: Intro -->
<section id="hero">
  <div id="intro"></div>
</section>

<!-- Phase 2: Welcome -->
<section class="welcome" id="welcome">
  <div>Welcome to my portfolio</div>

  <div class="menu" id="menu">
    <div class="focus" id="focus"></div>
    <div id="caseBtn">Case Studies</div>
    <div id="aboutBtn">About</div>
  </div>
</section>

<!-- Toggle -->
<div class="iconToggle" id="iconToggle">
  <button id="caseIcon"><i class="fa-solid fa-layer-group"></i></button>
  <button id="aboutIcon"><i class="fa-solid fa-user"></i></button>
</div>

<script>
/* ---------- TYPE EFFECT ---------- */
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,90);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,500);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}

/* ---------- SHOW WELCOME ---------- */
function showWelcome(){
 document.getElementById("hero").remove();
 const welcome=document.getElementById("welcome");
 welcome.style.opacity=1;
 // Show toggle under welcome text
 const iconToggle=document.getElementById("iconToggle");
 iconToggle.style.opacity=1;
 iconToggle.style.top="calc(50% + 100px)";
 iconToggle.style.transform="translateY(-50%)";
}
window.onload=type;

/* ---------- PAGE SYSTEM ---------- */
let currentPage=null;
const focus=document.getElementById("focus");
const iconToggle=document.getElementById("iconToggle");
const body=document.body;

function createPage(title){
 if(currentPage) currentPage.remove();
 const p=document.createElement("section");
 p.className="page";
 p.textContent=title;
 document.body.appendChild(p);
 setTimeout(()=>p.style.transform="translateX(0)",50);
 currentPage=p;

 // Phase 3: move toggle to top
 iconToggle.style.top="30px";
 iconToggle.style.transform="translateY(0)";
 iconToggle.style.opacity=1;

 // Add carousel if Case Studies
if(title==="Case Studies"){
  addCarousel(p);
}
}

/* ---------- FIRST TRANSITION ---------- */
function firstTransition(){
 document.getElementById("welcome").remove();
 body.style.background="#111";
 iconToggle.style.opacity=1;
}

/* ---------- MENU CLICK ---------- */
document.getElementById("caseBtn").onclick=()=>{ 
 focus.style.transform="translateX(0)";
 firstTransition();
 createPage("Case Studies");
}
document.getElementById("aboutBtn").onclick=()=>{ 
 focus.style.transform="translateX(100%)";
 firstTransition();
 createPage("About");
}

/* ---------- ICON TOGGLE ---------- */
document.getElementById("caseIcon").onclick=()=>{ createPage("Case Studies"); }
document.getElementById("aboutIcon").onclick=()=>{ createPage("About"); }

/* ---------- CAROUSEL ---------- */
function addCarousel(page){
  // Create carousel container
  const carousel=document.createElement("div");
  carousel.className="carousel";
  carousel.innerHTML=`
    <div class="carousel-track">
      <div class="carousel-item">Project 1</div>
      <div class="carousel-item">Project 2</div>
      <div class="carousel-item">Project 3</div>
    </div>
    <div class="carousel-nav">
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>
  `;
  page.appendChild(carousel);

  const track=carousel.querySelector(".carousel-track");
  const items=carousel.querySelectorAll(".carousel-item");
  let index=0;

  // Show carousel on hover of page text
  page.addEventListener("mouseenter",()=>{ carousel.style.display="block"; });
  page.addEventListener("mouseleave",()=>{ carousel.style.display="none"; });

  // Carousel nav
  const prev=carousel.querySelector(".prev");
  const next=carousel.querySelector(".next");
  prev.onclick=()=>{ index=(index-1+items.length)%items.length; track.style.transform=`translateX(-${index*100}%)`; }
  next.onclick=()=>{ index=(index+1)%items.length; track.style.transform=`translateX(-${index*100}%)`; }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Reveal Intro Test</title>
<style>
  body {
    margin: 0;
    font-family: 'Urbanist', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  /* Mask wrapper for slide effect */
  .line-mask {
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .intro-line {
    transform: translateY(120%);
    opacity: 0;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 600;
    transition: transform 1s cubic-bezier(.22,1,.36,1),
                opacity 1s ease;
  }

  .gradient {
    background: linear-gradient(90deg,#00f0ff,#ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }
</style>
</head>
<body>

<div>
  <div class="line-mask"><div class="intro-line" id="l1">Hi, I’m Lutanda</div></div>
  <div class="line-mask"><div class="intro-line gradient" id="l2">A UI/UX Designer</div></div>
  <div class="line-mask"><div class="intro-line" id="l3">Crafting futuristic, intuitive experiences</div></div>
</div>

<script>
  function slideInLine(line, delay) {
    setTimeout(() => {
      line.style.transform = 'translateY(0)';
      line.style.opacity = '1';
    }, delay);
  }

  slideInLine(document.getElementById('l1'), 400);
  slideInLine(document.getElementById('l2'), 1200);
  slideInLine(document.getElementById('l3'), 2200);
</script>

</body>
</html>

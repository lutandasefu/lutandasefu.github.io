<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sulphur Point',sans-serif;overflow:hidden;}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;color:#fff;}

/* INTRO */
#intro{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:5;}
#introTextWrapper{font-size:clamp(2.2rem,6vw,4.4rem);}
.cursor{width:2px;height:1em;background:#111;margin-left:6px;animation:blink .7s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* WELCOME */
#welcome{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;opacity:0;transition:.8s;z-index:4;}
#welcome div{margin-bottom:30px;font-size:clamp(3rem,6vw,5rem);color:#111;text-align:center;}
#welcome-toggle{position:relative;width:190px;height:60px;background:#fff;border-radius:50px;border:2px solid #fff;display:flex;}
#welcome-toggle .focus{position:absolute;top:6px;left:6px;width:78px;height:48px;border-radius:50px;background:#111;transition:.35s;}
#welcome-toggle button{flex:1;border:none;background:none;cursor:pointer;display:flex;justify-content:center;align-items:center;z-index:2;}
#welcome-toggle svg{width:24px;height:24px;stroke:#111;transition:.3s;}
#welcome-toggle button.active svg{stroke:#fff;}

/* RIGHT TOGGLE */
.right-toggle{position:fixed;right:30px;top:50%;transform:translateY(-50%);width:75px;height:160px;background:#fff;border-radius:45px;display:none;flex-direction:column;border:2px solid #fff;z-index:10;}
.right-focus{position:absolute;width:100%;height:50%;background:#111;border-radius:45px;transition:.35s;}
.right-toggle button{flex:1;border:none;background:none;display:flex;justify-content:center;align-items:center;z-index:2;cursor:pointer;}
.right-toggle svg{width:28px;height:28px;stroke:#111;transition:.3s;}
.right-toggle button.active svg{stroke:#fff;}

/* PAGES */
.page{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:clamp(2rem,5vw,3rem);transform:translateX(100%);transition:.8s;}
#case{flex-direction:column;gap:40px;}
#caseTitle{cursor:pointer;transition:.3s;}
.showRows #caseTitle{opacity:0;}

/* CENTERED ROW CAROUSEL */
#hoverGrid{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:10px;
  opacity:0;
  pointer-events:none;
  transition:.4s;
}
.showRows #hoverGrid{opacity:1;pointer-events:auto;}

.row{
  width:40px;
  height:220px;
  border-radius:14px;
  transition:width .25s ease;
  cursor:pointer;
}
.row:nth-child(1){background:#e63946;}
.row:nth-child(2){background:#f4a261;}
.row:nth-child(3){background:#2a9d8f;}
.row:nth-child(4){background:#457b9d;}
.row:nth-child(5){background:#9b5de5;}
.row:nth-child(6){background:#ff006e;}

/* ROW PAGES */
.row-page{
  position:absolute;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .6s;
  z-index:3;
}
.row-page.active{
  opacity:1;
  pointer-events:auto;
}

/* ABOUT PAGE */
#about{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-size:2.5rem;transform:translateX(100%);transition:.8s;}
</style>
</head>
<body class="grey-bg">

<!-- INTRO -->
<section id="intro">
  <div id="introTextWrapper">
    <span id="introText"></span><span class="cursor"></span>
  </div>
</section>

<!-- WELCOME -->
<section id="welcome">
  <div>Welcome to my portfolio</div>
  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>
    <button id="toCase" class="active">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>
    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<!-- CASE -->
<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>
  <div id="hoverGrid">
    <div class="row"></div><div class="row"></div><div class="row"></div>
    <div class="row"></div><div class="row"></div><div class="row"></div>
  </div>
</section>

<!-- ROW PAGES -->
<section id="row1" class="row-page">Row 1 Page</section>
<section id="row2" class="row-page">Row 2 Page</section>
<section id="row3" class="row-page">Row 3 Page</section>
<section id="row4" class="row-page">Row 4 Page</section>
<section id="row5" class="row-page">Row 5 Page</section>
<section id="row6" class="row-page">Row 6 Page</section>

<!-- ABOUT -->
<section id="about" class="page">About</section>

<!-- RIGHT TOGGLE -->
<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn" class="active">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>
  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
/* INTRO TYPING */
const intro=document.getElementById("intro");
const welcome=document.getElementById("welcome");
const introText=document.getElementById("introText");
const lines=["Hi there, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
function type(){
 if(c<lines[l].length){introText.textContent+=lines[l][c++];setTimeout(type,80);}
 else if(l<lines.length-1){setTimeout(()=>{introText.textContent="";c=0;l++;type();},600);}
 else setTimeout(()=>{intro.remove();welcome.style.opacity=1;},800);
}
type();

/* NAVIGATION */
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const rightToggle=document.getElementById("rightToggle");
const wFocus=document.getElementById("wFocus");
const rFocus=document.getElementById("rFocus");
const toCase=document.getElementById("toCase");
const toAbout=document.getElementById("toAbout");
const caseBtn=document.getElementById("caseBtn");
const aboutBtn=document.getElementById("aboutBtn");

function activate(a,b,focus,dir){
 a.classList.add("active");
 b.classList.remove("active");
 focus.style.transform=dir;
}

function goCase(){
 document.body.classList.replace("grey-bg","black-bg");
 welcome.style.transform="translateY(-100%)";
 rightToggle.style.display="flex";
 casePage.style.transform="translateX(0)";
 aboutPage.style.transform="translateX(100%)";
 activate(toCase,toAbout,wFocus,"translateX(0)");
 activate(caseBtn,aboutBtn,rFocus,"translateY(0)");
}
function goAbout(){
 document.body.classList.replace("grey-bg","black-bg");
 welcome.style.transform="translateY(-100%)";
 rightToggle.style.display="flex";
 aboutPage.style.transform="translateX(0)";
 casePage.style.transform="translateX(-100%)";
 activate(toAbout,toCase,wFocus,"translateX(100%)");
 activate(aboutBtn,caseBtn,rFocus,"translateY(100%)");
}
toCase.onclick=goCase;
toAbout.onclick=goAbout;
caseBtn.onclick=goCase;
aboutBtn.onclick=goAbout;

/* SMOOTH ROW HOVER */
const caseSection=document.getElementById("case");
const grid=document.getElementById("hoverGrid");
const rows=[...grid.children];
const caseTitle=document.getElementById("caseTitle");

caseTitle.onmouseenter = () => caseSection.classList.add("showRows");
grid.onmouseleave = () => caseSection.classList.remove("showRows");

const base=40, max=140;
let targetWidths = rows.map(() => base);

// Smooth animation loop
function animateRows() {
  rows.forEach((r, i) => {
    const current = parseFloat(r.style.width) || base;
    const diff = targetWidths[i] - current;
    r.style.width = current + diff * 0.2 + "px"; // easing factor 0.2
  });
  requestAnimationFrame(animateRows);
}
animateRows();

// Update target widths based on mouse position
grid.onmousemove = e => {
  rows.forEach((r, i) => {
    const rect = r.getBoundingClientRect();
    const d = Math.abs(e.clientX - (rect.left + rect.width / 2));
    targetWidths[i] = base + Math.max(0, 180 - d) / 180 * max;
  });
};
grid.onmouseleave = () => targetWidths = rows.map(() => base);

/* CLICK ROW TO SHOW PAGE */
rows.forEach((row,i)=>{
  row.dataset.page=`row${i+1}`;
  row.addEventListener("click", (e)=>{
    e.preventDefault();
    const pageId = row.dataset.page;
    const section = document.getElementById(pageId);
    if(section){
      caseSection.classList.remove("showRows");
      caseTitle.style.opacity=0;
      document.querySelectorAll(".row-page").forEach(p=>p.classList.remove("active"));
      section.classList.add("active");
    }
  });
});
</script>
</body>
</html>

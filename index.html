<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
  scroll-behavior: smooth;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position: relative;
  transition: height 1s cubic-bezier(.22,1,.36,1);
  background: #ddd;
}

.hero.shrink{
  height:50vh;
}

h1{
  font-size:5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
  transition:opacity 1s ease, transform 1s ease;
}

.fade-up{
  opacity:0;
  transform:translateY(-60px);
}

@keyframes blink{
  0%,50%,100%{border-color:#333;}
  25%,75%{border-color:transparent;}
}
.typing{animation:blink .7s step-end infinite;}
.cursor-end{animation:blink .7s step-end 3;}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:center; /* center ul inside navbar */
  align-items:center;
  width:80%;
  max-width:420px;
  background: #ffffff;
  border-radius: 32px;
  box-shadow: 0px 15px 25px rgba(0,0,0,0.15),
              0px 10px 10px rgba(0,0,0,0.12);
  padding: 0.5rem 0;
  font-family:'Sulphur Point',sans-serif;
  font-weight:300;
  opacity:0;
  transition:opacity .6s ease;
}

.navbar.visible {
  opacity:1;
}

.nav-list {
  display:flex;
  justify-content:space-evenly;
  align-items:center;
  width:100%;
  list-style:none;
  margin:0;
  padding:0;
}

.list-item{
  cursor:pointer;
  font-size:1.2rem;
  color:#333;
  padding:0.6rem 1.2rem;
  border-radius:16px;
  position: relative;
  transition: transform 0.4s ease, color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

/* subtle hover glow like CodePen */
.list-item::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  border-radius:16px;
  background: rgba(87,86,230,0.15);
  opacity:0;
  transition: opacity 0.3s ease;
  z-index:-1;
}

.list-item:hover::before{
  opacity:1;
}

.list-item:hover{
  color:#5756e6;
  transform:translateY(-4px);
  box-shadow: 0px 4px 12px rgba(87,86,230,0.25);
}

/* NEXT SECTION */
.next{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2.5rem;
  background:#ddd; /* same as hero */
  opacity:0;
  transform:translateY(80px);
  transition:opacity 1.2s cubic-bezier(.22,1,.36,1),
             transform 1.2s cubic-bezier(.22,1,.36,1);
}
.next.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences = [
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
let s=0,c=0;

function rand(){return 110+Math.random()*40;}

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 } else {
  if(s<sentences.length-1){
    setTimeout(erase,1400);
  } else {
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(()=>{
      intro.classList.add("fade-up");
      setTimeout(()=>{
        hero.classList.add("shrink"); // Hero shrinks to 50vh
        buildNext();
      },1000);
    },2100);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 } else {
  s++;
  setTimeout(type,rand());
 }
}

function buildNext(){
 document.body.style.overflow="auto";

 // NAVBAR with ul/li
 const nav = document.createElement("div");
 nav.className="navbar";
 nav.innerHTML=`
  <ul class="nav-list">
    <li class="list-item">About</li>
    <li class="list-item">Case Studies</li>
    <li class="list-item">Contact Details</li>
  </ul>
 `;
 hero.appendChild(nav);

 // NEXT SECTION
 const next = document.createElement("section");
 next.className="next";
 next.innerText="Welcome to my portfolio";
 document.body.appendChild(next);

 setTimeout(()=>{
   window.scrollTo({ top: window.innerHeight, behavior: "smooth" });
   setTimeout(()=>next.classList.add("show"),400);
 },200);

 // Show navbar only when hero is in view
 window.addEventListener("scroll",()=>{
   if(window.scrollY < window.innerHeight - 80){
     nav.classList.add("visible");
   } else {
     nav.classList.remove("visible");
   }
 });
}

window.onload=type;
</script>

</body>
</html>

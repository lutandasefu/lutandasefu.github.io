<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
}

/* Dynamic backgrounds */
body.grey-bg{ background:#e6e6e6; }
body.black-bg{ background:#111; }

/* ---------- SECTIONS ---------- */
section{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  font-size:clamp(2.2rem,6vw,4.4rem);
}

/* ---------- INTRO (FIXED CURSOR) ---------- */
#intro{
  z-index:5;
  position:relative;
}

/* Blinking cursor attached to text */
#intro::after{
  content:"";
  display:inline-block;
  width:2px;
  height:1em;
  background:#111;
  margin-left:6px;
  animation:blink .7s step-end infinite;
  vertical-align:bottom;
}

@keyframes blink{
  50%{opacity:0;}
}

/* ---------- WELCOME ---------- */
#welcome{
  opacity:0;
  transition:opacity .8s ease, transform .8s ease;
  z-index:4;
}

/* ---------- WELCOME TOGGLE ---------- */
#welcome-toggle{
  margin-top:40px;
  display:flex;
  position:relative;
  width:190px;
  height:60px;
  background:#fff;
  border-radius:50px;
  border:2px solid #fff;
}
#welcome-toggle .focus{
  position:absolute;
  top:6px;
  left:6px;
  width:78px;
  height:48px;
  border-radius:50px;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
#welcome-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
  padding:0 10px;
}
#welcome-toggle button svg{
  width:24px;
  height:24px;
  stroke:black;
  fill:none;
  transition:.3s;
}
#welcome-toggle button.active svg{
  stroke:white;
}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  width:75px;
  height:160px;
  background:#fff;
  border-radius:45px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  border:2px solid #fff;
  z-index:10;
}
.right-toggle .right-focus{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:50%;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
.right-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
}
.right-toggle button svg{
  width:28px;
  height:28px;
  stroke:black;
  fill:none;
  transition:.3s;
}
.right-toggle button.active svg{
  stroke:white;
}

/* ---------- PAGES ---------- */
.page{
  background:#111;
  color:white;
  transform:translateX(100%);
  transition:transform .8s cubic-bezier(.77,0,.18,1);
  z-index:3;
}

/* ---------- CAROUSEL ---------- */
.carousel{
  position:absolute;
  bottom:10%;
  width:80%;
  height:200px;
  opacity:0;
  transform:scale(.8);
  transition:.5s ease;
  display:flex;
  gap:20px;
  justify-content:center;
}
.carousel img{
  width:200px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
}
.showCarousel{
  opacity:1;
  transform:scale(1);
}
</style>
</head>

<body class="grey-bg">

<section id="intro"></section>

<section id="welcome">
  <div>Welcome to my portfolio</div>

  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>

    <button id="toCase">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>

    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>
  <div class="carousel" id="carousel">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>
</section>

<section id="about" class="page">About</section>

<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>

  <button id="caseBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>

  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
const intro=document.getElementById("intro");
const welcome=document.getElementById("welcome");
const lines=["Hi there...","I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,80);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}
   else{setTimeout(showWelcome,800);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}
function showWelcome(){
 intro.style.opacity=0;
 setTimeout(()=>{intro.remove();welcome.style.opacity=1;},600);
}
type();
</script>

</body>
</html>

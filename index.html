<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
  transition:.6s;
}
body.dark{background:#111;color:#fff;}

section{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:.8s;
}
section.active{
  opacity:1;
  pointer-events:auto;
}

/* ---------------- INTRO ---------------- */
#intro{
  background:#e6e6e6;
  z-index:10;
}
#typing{
  font-size:32px;
  border-right:2px solid #111;
  white-space:nowrap;
  overflow:hidden;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{border-color:transparent;}}

/* ---------------- WELCOME ---------------- */
#welcome h1{
  font-size:38px;
  margin-bottom:30px;
}

/* ---------------- TOGGLE ---------------- */
.toggle{
  display:flex;
  gap:25px;
  font-size:28px;
  cursor:pointer;
}
.toggle span{
  opacity:.4;
  transition:.3s;
}
.toggle span.active{
  opacity:1;
  color:#fff;
}

/* ---------------- NAV ---------------- */
#nav{
  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:60px;
  font-size:20px;
  z-index:5;
}
#nav span{
  cursor:pointer;
  opacity:.4;
  transition:.3s;
}
#nav span.active{
  opacity:1;
  color:#fff;
}

/* ---------------- CASE ---------------- */
#case{
  position:relative;
  justify-content:center;
  align-items:center;
}

#caseTitle{
  font-size:42px;
  cursor:pointer;
  transition:.4s;
}

/* ---------------- HOVER GRID ---------------- */
#hoverGrid{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:10px;
  opacity:0;
  pointer-events:none;
  transition:.5s;
}

.row{
  width:40px;
  height:260px;
  transition:.5s cubic-bezier(.77,0,.18,1);
  cursor:pointer;
}

.row:hover{
  width:260px;
}

.row:nth-child(1){background:#ff595e;}
.row:nth-child(2){background:#ffca3a;}
.row:nth-child(3){background:#8ac926;}
.row:nth-child(4){background:#1982c4;}
.row:nth-child(5){background:#6a4c93;}
.row:nth-child(6){background:#222;}

/* ---------------- ABOUT ---------------- */
#about h2{
  font-size:36px;
}
</style>
</head>

<body>

<!-- INTRO -->
<section id="intro" class="active">
  <div id="typing"></div>
</section>

<!-- WELCOME -->
<section id="welcome">
  <h1>Welcome to my portfolio</h1>
  <div class="toggle" id="welcomeToggle">
    <span id="lightIcon">☀</span>
    <span id="darkIcon">☾</span>
  </div>
</section>

<!-- NAV -->
<div id="nav">
  <span id="navCase">Case Studies</span>
  <span id="navAbout">About</span>
</div>

<!-- CASE -->
<section id="case">
  <div id="caseTitle">Case Studies</div>

  <div id="hoverGrid">
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <h2>About Me</h2>
</section>

<script>
// ---------------- TYPING INTRO ----------------
const text = "Hi, I'm Lutanda Sefu";
let i=0;
const typing = document.getElementById('typing');

function type(){
  if(i<text.length){
    typing.innerHTML += text[i];
    i++;
    setTimeout(type,60);
  }else{
    setTimeout(()=>{
      intro.classList.remove('active');
      welcome.classList.add('active');
    },800);
  }
}
type();

// ---------------- ELEMENTS ----------------
const intro = document.getElementById('intro');
const welcome = document.getElementById('welcome');
const caseSec = document.getElementById('case');
const about = document.getElementById('about');

const navCase = document.getElementById('navCase');
const navAbout = document.getElementById('navAbout');

const caseTitle = document.getElementById('caseTitle');
const grid = document.getElementById('hoverGrid');

// ---------------- TOGGLE DARK MODE ----------------
const lightIcon = document.getElementById('lightIcon');
const darkIcon = document.getElementById('darkIcon');

function setDark(on){
  document.body.classList.toggle('dark',on);
  darkIcon.classList.toggle('active',on);
  lightIcon.classList.toggle('active',!on);
}

darkIcon.onclick=()=>setDark(true);
lightIcon.onclick=()=>setDark(false);

// ---------------- NAVIGATION ----------------
function show(section){
  [welcome,caseSec,about].forEach(s=>s.classList.remove('active'));
  section.classList.add('active');

  navCase.classList.toggle('active',section===caseSec);
  navAbout.classList.toggle('active',section===about);
}

navCase.onclick=()=>show(caseSec);
navAbout.onclick=()=>show(about);

// ---------------- CASE HOVER EFFECT ----------------
caseTitle.addEventListener('mouseenter',()=>{
  caseTitle.style.opacity=0;
  grid.style.opacity=1;
  grid.style.pointerEvents='auto';
});

grid.addEventListener('mouseleave',()=>{
  caseTitle.style.opacity=1;
  grid.style.opacity=0;
  grid.style.pointerEvents='none';
});
</script>

</body>
</html>

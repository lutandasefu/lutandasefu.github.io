<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimal Gradient</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #000;
  overflow: hidden;
}

.gradient {
  position: absolute;
  width: 400vmax;
  height: 400vmax;
  border-radius: 50%;
  opacity: 0.8;
  filter: blur(120px);
  animation: gradient-rotate 20s linear infinite;
}

/* First scheme: teal to orange */
.gradient:nth-child(1) {
  background: radial-gradient(
    circle at center,
    #00ffcc 0%,
    #ff6600 100%
  );
  top: -150vmax;
  left: -150vmax;
}

.gradient:nth-child(2) {
  background: radial-gradient(
    circle at center,
    #ff0066 0%,
    #00ccff 100%
  );
  top: -150vmax;
  right: -150vmax;
  animation-delay: -7s;
}

.gradient:nth-child(3) {
  background: radial-gradient(
    circle at center,
    #6600ff 0%,
    #ffcc00 100%
  );
  bottom: -150vmax;
  left: -150vmax;
  animation-delay: -14s;
}

@keyframes gradient-rotate {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="gradient"></div>
<div class="gradient"></div>
<div class="gradient"></div>
</body>
</html>

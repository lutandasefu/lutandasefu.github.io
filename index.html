<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutanda | UI/UX Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

  <style>
    /* Reset and body */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sulphur Point', sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    /* Typed text */
    .hero h1 {
      font-size: 4rem;
      font-weight: 300;
      display: inline-block;
      border-right: 2px solid #111; /* cursor */
      white-space: nowrap;
      overflow: hidden;
    }

    /* Blinking cursor */
    @keyframes blink {
      0%, 50%, 100% { border-color: #111; }
      25%, 75% { border-color: transparent; }
    }

    .typing {
      border-right: 2px solid #111;
      animation: blink 0.7s step-end infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1 id="intro" class="typing"></h1>
  </section>

  <script>
    const sentences = [
      "Hey, I'm Lutanda",
      "A UI/UX designer",
      "I design for clarity",
      "And purpose"
    ];

    const introEl = document.getElementById("intro");
    let sentenceIndex = 0;
    let charIndex = 0;

    const baseTypingSpeed = 100; // average typing speed
    const erasingSpeed = 50;
    const delayBetween = 1500;

    function randomTypingSpeed() {
      // small variation for more fluid, natural typing
      return baseTypingSpeed + Math.random() * 50;
    }

    function typeSentence() {
      if (charIndex < sentences[sentenceIndex].length) {
        introEl.textContent += sentences[sentenceIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeSentence, randomTypingSpeed());
      } else {
        setTimeout(eraseSentence, delayBetween);
      }
    }

    function eraseSentence() {
      if (charIndex > 0) {
        introEl.textContent = sentences[sentenceIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseSentence, erasingSpeed);
      } else {
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(typeSentence, randomTypingSpeed());
      }
    }

    window.onload = () => typeSentence();
  </script>

</body>
</html>

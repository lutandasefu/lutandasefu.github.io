<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sulphur Point',sans-serif;overflow:hidden;}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;color:#fff}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:5;}
#introTextWrapper{display:flex;align-items:center;font-size:clamp(2.2rem,6vw,4.4rem);}
.cursor{width:2px;height:1em;background:#111;margin-left:6px;animation:blink .7s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* ---------- WELCOME ---------- */
#welcome{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;opacity:0;transition:.8s;z-index:4;}
#welcome div{margin-bottom:30px;font-size:clamp(3rem,6vw,5rem);color:#111;text-align:center;}

#welcome-toggle{display:flex;position:relative;width:190px;height:60px;background:#fff;border-radius:50px;border:2px solid #fff;}
#welcome-toggle .focus{position:absolute;top:6px;left:6px;width:78px;height:48px;border-radius:50px;background:#111;transition:.35s;}
#welcome-toggle button{flex:1;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
#welcome-toggle svg{width:24px;height:24px;stroke:#111;}
#welcome-toggle button.active svg{stroke:#fff}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{position:fixed;right:30px;top:50%;transform:translateY(-50%);width:75px;height:160px;background:#fff;border-radius:45px;display:none;flex-direction:column;border:2px solid #fff;z-index:10;}
.right-focus{position:absolute;width:100%;height:50%;background:#111;border-radius:45px;transition:.35s;}
.right-toggle button{flex:1;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.right-toggle svg{width:28px;height:28px;stroke:#111;}
.right-toggle button.active svg{stroke:#fff}

/* ---------- PAGES ---------- */
.page{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;transform:translateX(100%);transition:.8s cubic-bezier(.77,0,.18,1);}

/* ---------- CASE SLIDER ---------- */
#case{background:#111;}
.case-slider{width:90%;max-width:1400px;}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;}
.head h2{font-size:clamp(2rem,4vw,3rem);font-weight:500;}
.controls{display:flex;gap:.5rem;}
.nav-btn{width:40px;height:40px;border-radius:50%;border:none;background:#222;color:#fff;font-size:22px;cursor:pointer;}
.slider{overflow:hidden;}
.track{display:flex;gap:1.25rem;align-items:center;scroll-behavior:smooth;}
.project-card{position:relative;flex:0 0 5rem;height:26rem;border-radius:1rem;overflow:hidden;cursor:pointer;transition:.55s cubic-bezier(.25,.46,.45,.94);}
.project-card[active]{flex-basis:30rem;transform:translateY(-6px);}
.project-card__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.75);}
.project-card__content{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:linear-gradient(transparent 40%,rgba(0,0,0,.85));}
.project-card__title{color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.2rem;}
.project-card[active] .project-card__title{writing-mode:horizontal-tb;transform:none;font-size:2.2rem;}
.dots{display:flex;justify-content:center;gap:.5rem;margin-top:25px;}
.dot{width:12px;height:12px;border-radius:50%;background:#444;cursor:pointer;}
.dot.active{background:#fff}
</style>
</head>

<body class="grey-bg">

<section id="intro">
  <div id="introTextWrapper">
    <span id="introText"></span>
    <span class="cursor"></span>
  </div>
</section>

<section id="welcome">
  <div>Welcome to my portfolio</div>
  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>
    <button id="toCase"></button>
    <button id="toAbout"></button>
  </div>
</section>

<section id="case" class="page">
  <div class="case-slider">

    <div class="head">
      <h2>Case Studies</h2>
      <div class="controls">
        <button id="prev" class="nav-btn">‹</button>
        <button id="next" class="nav-btn">›</button>
      </div>
    </div>

    <div class="slider">
      <div class="track" id="track">

        <!-- paste your project-card articles here exactly -->

      </div>
    </div>

    <div class="dots" id="dots"></div>

  </div>
</section>

<section id="about" class="page">About</section>

<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn"></button>
  <button id="aboutBtn"></button>
</div>

<script>
/* intro typing unchanged */
const introText=document.getElementById("introText");
const welcome=document.getElementById("welcome");
const lines=["Hi there, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
function type(){if(c<lines[l].length){introText.textContent+=lines[l][c++];setTimeout(type,80);}else{if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,800);}}}
function erase(){if(c>0){introText.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}else{l++;type();}}
function showWelcome(){intro.style.opacity=0;setTimeout(()=>{intro.remove();welcome.style.opacity=1;},600);}
type();

/* navigation unchanged */
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const right=document.getElementById("rightToggle");
function activateBlackBg(){document.body.classList.remove("grey-bg");document.body.classList.add("black-bg");}
function showCase(){activateBlackBg();casePage.style.transform="translateX(0)";aboutPage.style.transform="translateX(100%)";}
function showAbout(){activateBlackBg();aboutPage.style.transform="translateX(0)";casePage.style.transform="translateX(-100%)";}
toCase.onclick=()=>{welcome.style.transform="translateY(-100%)";right.style.display="flex";showCase();}
toAbout.onclick=()=>{welcome.style.transform="translateY(-100%)";right.style.display="flex";showAbout();}
caseBtn.onclick=showCase;
aboutBtn.onclick=showAbout;

/* slider JS */
(() => {
  const track=document.getElementById("track");
  const wrap=track.parentElement;
  const cards=Array.from(track.children);
  const prev=document.getElementById("prev");
  const next=document.getElementById("next");
  const dotsBox=document.getElementById("dots");
  cards.forEach((_,i)=>{const d=document.createElement("span");d.className="dot";d.onclick=()=>activate(i,true);dotsBox.appendChild(d);});
  const dots=Array.from(dotsBox.children);
  let current=0;
  function center(i){
    const card=cards[i];
    wrap.scrollTo({left:card.offsetLeft-(wrap.clientWidth/2-card.clientWidth/2),behavior:"smooth"});
  }
  function toggleUI(i){
    cards.forEach((c,k)=>c.toggleAttribute("active",k===i));
    dots.forEach((d,k)=>d.classList.toggle("active",k===i));
  }
  function activate(i,s){current=i;toggleUI(i);if(s)center(i);}
  function go(s){activate(Math.min(Math.max(current+s,0),cards.length-1),true);}
  prev.onclick=()=>go(-1);
  next.onclick=()=>go(1);
  cards.forEach((card,i)=>card.onclick=()=>activate(i,true));
  toggleUI(0);center(0);
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
  scroll-behavior:smooth;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position: relative;
  background: #ddd;
  transition: opacity 1.2s ease;
}

.hero.fade-out{
  opacity:0;
}

/* Typed intro */
h1{
  font-size:5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
  transition:opacity 1s ease, transform 1s ease;
}

.typing{animation:blink .7s step-end infinite;}
.cursor-end{animation:blink .7s step-end 3;}

@keyframes blink{
  0%,50%,100%{border-color:#333;}
  25%,75%{border-color:transparent;}
}

/* NEXT SECTION (centered content) */
.next{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#ddd; 
  opacity:0;
  transition:opacity 1.2s ease;
}

.next.show{
  opacity:1;
}

/* Welcome heading */
.next h2{
  font-family:'Sulphur Point',sans-serif;
  font-weight:300;
  font-size:5rem; /* slightly reduced */
  text-align:center;
  margin-bottom:50px;
}

/* MENU from CodePen */
.navbar{
  display:flex;
  justify-content:center;
  align-items:center;
}

.nav-list{
  display:flex;
  gap:50px;
  list-style:none;
  position:relative;
}

.list-item{
  position:relative;
  font-size:2rem;
  font-weight:300;
  cursor:pointer;
  transition: color 0.3s ease;
  padding-bottom:5px;
  color:#333;
}

.list-item::after{
  content:'';
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:3px;
  background:#5756e6;
  border-radius:2px;
  transition: width 0.3s ease;
}

.list-item:hover::after,
.list-item.active::after{
  width:100%;
}

.list-item:hover{
  color:#5756e6;
}

/* Responsive */
@media (max-width:768px){
  .next h2{
    font-size:3.5rem;
  }
  .nav-list{
    gap:30px;
  }
  .list-item{
    font-size:1.5rem;
  }
}

@media (max-width:480px){
  .next h2{
    font-size:2.5rem;
  }
  .nav-list{
    gap:20px;
  }
  .list-item{
    font-size:1.2rem;
  }
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences = [
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
let s=0,c=0;

function rand(){return 110+Math.random()*40;}

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 } else {
  if(s<sentences.length-1){
    setTimeout(erase,1400);
  } else {
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(()=>{
      intro.classList.add("fade-up");
      setTimeout(()=>{
        fadeHero();
      },2100);
    },2100);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 } else {
  s++;
  setTimeout(type,rand());
 }
}

function fadeHero(){
  hero.classList.add("fade-out");

  // NEXT SECTION
  const next = document.createElement("section");
  next.className="next";
  next.innerHTML = `
    <h2>Welcome to my portfolio</h2>
    <div class="navbar">
      <ul class="nav-list">
        <li class="list-item">About</li>
        <li class="list-item">Case Studies</li>
        <li class="list-item">Contact Details</li>
      </ul>
    </div>
  `;
  document.body.appendChild(next);

  // show next section after fade
  setTimeout(()=>next.classList.add("show"),800);

  // allow scrolling
  document.body.style.overflow="auto";

  // Toggle active state on click
  const items = next.querySelectorAll(".list-item");
  items.forEach(item=>{
    item.addEventListener("click",()=>{
      items.forEach(i=>i.classList.remove("active"));
      item.classList.add("active");
    });
  });
}

window.onload=type;
</script>

</body>
</html>

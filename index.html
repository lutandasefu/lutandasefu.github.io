<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
  color:#111;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
#intro{
  font-size:4.5rem;
  border-right:2px solid #111;
  white-space:nowrap;
  animation:blink .7s step-end infinite;
}
@keyframes blink{0%,50%,100%{border-color:#111;}25%,75%{border-color:transparent;}}

/* PAGE */
.page{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
  background:#e6e6e6;
  transition:background .6s ease,color .6s ease;
}

/* DARK PAGE STATE */
.page.dark{
  background:#111;
  color:#fff;
}

/* MENU TOGGLE */
.menu{
  position:absolute;
  top:40px;
  display:flex;
  align-items:center;
  gap:24px;
  font-size:1.3rem;
  letter-spacing:1px;
}

.switch{
  position:relative;
  width:90px;
  height:44px;
}
.switch input{display:none;}

.slider{
  position:absolute;
  inset:0;
  background:#111;
  border-radius:50px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:36px;
  height:36px;
  left:4px;
  top:4px;
  background:#e6e6e6;
  border-radius:50%;
  transition:.45s cubic-bezier(.77,0,.18,1);
}
input:checked + .slider:before{
  transform:translateX(46px);
}

/* CURTAIN */
.curtain{
  position:fixed;
  inset:0;
  background:#111;
  transform:translateY(-100%);
  z-index:1000;
}

h2{
  font-size:4rem;
  margin-top:120px;
  transition:opacity .6s ease;
}

@media(max-width:768px){
  #intro{font-size:2.5rem;}
  h2{font-size:2.2rem;}
  .menu{font-size:1rem;}
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div id="intro"></div>
</section>

<div class="curtain" id="curtain"></div>

<script>
/* TYPING INTRO */
const sentences=[
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];
let s=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<sentences[s].length){
   intro.textContent+=sentences[s][c++];
   setTimeout(type,90);
 }else{
   if(s<sentences.length-1){
     setTimeout(erase,600);
   }else{
     setTimeout(showWelcome,800);
   }
 }
}
function erase(){
 if(c>0){
   intro.textContent=sentences[s].substring(0,--c);
   setTimeout(erase,40);
 }else{s++;type();}
}

/* CREATE PAGE */
function createPage(title,dark=false){
 const page=document.createElement("section");
 page.className="page"+(dark?" dark":"");
 page.innerHTML=`
   <div class="menu">
     <span>Case Studies</span>
     <label class="switch">
       <input type="checkbox" id="navToggle" ${dark?"checked":""}>
       <span class="slider"></span>
     </label>
     <span>About</span>
   </div>
   <h2>${title}</h2>
 `;
 document.body.appendChild(page);
 page.querySelector("#navToggle").addEventListener("change",togglePage);
}

/* WELCOME */
function showWelcome(){
 document.getElementById("hero").remove();
 createPage("Welcome to my portfolio");
}

/* TOGGLE LOGIC */
function togglePage(e){
 const curtain=document.getElementById("curtain");
 curtain.style.transition="transform .8s ease";
 curtain.style.transform="translateY(0%)";

 setTimeout(()=>{
   document.querySelector(".page").remove();

   if(e.target.checked){
     createPage("About",true);
   }else{
     createPage("Case Studies",true);
   }

 },800);
}

window.onload=type;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Slide Intro</title>
<style>
  body {
    margin: 0;
    font-family: 'Urbanist', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  .slide-wrapper {
    display: flex;
    gap: 1rem;
    font-size: clamp(3rem, 7vw, 6rem);
    font-weight: 700;
  }

  .word {
    display: inline-block;
    overflow: hidden;
    height: 1em;
  }

  .word span {
    display: inline-block;
    transform: translateY(100%);
    opacity: 0;
    transition: transform 1s cubic-bezier(.22,1,.36,1),
                opacity 1s ease;
  }

  .word.interactive span {
    transform: translateY(-100%);
  }

  .gradient {
    background: linear-gradient(90deg,#00f0ff,#ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Slide-in active class */
  .slide-in span {
    transform: translateY(0) !important;
    opacity: 1 !important;
  }
</style>
</head>
<body>

<div class="slide-wrapper">
  <div class="word interactive"><span class="gradient">Interactive</span></div>
  <div class="word development"><span>Development</span></div>
</div>

<script>
  const interactive = document.querySelector('.interactive');
  const development = document.querySelector('.development');

  // Start the animation after a short delay
  setTimeout(() => {
    interactive.classList.add('slide-in');
    development.classList.add('slide-in');
  }, 500);
</script>

</body>
</html>

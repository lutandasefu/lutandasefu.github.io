<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@100&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}
h1{
  font-size:4.5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
}
.typing{animation:blink .7s step-end infinite;}
@keyframes blink{0%,50%,100%{border-color:#333;}25%,75%{border-color:transparent;}}

/* PAGES */
.page{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#ddd;
  text-align:center;
}

/* MENU */
#app{
  width:600px;
  height:70px;
  display:grid;
  place-items:center;
  border-radius:50px;
  background:#fff;
  border:3px solid #fff;
  perspective:1000px;
}
#app ul{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  position:relative;
  border-radius:50px;
  overflow:hidden;
}
#app li{
  display:grid;
  place-items:center;
  font-family:'Urbanist',sans-serif;
  font-weight:100;
  font-size:1.2rem;
  color:#000;
  cursor:pointer;
  z-index:2;
}
.focus-el{
  position:absolute;
  top:0;left:0;
  height:100%;
  width:50%;
  background:#ddd;
  border-radius:50px;
  z-index:1;
}

/* Buttons */
.btn{
  position:fixed;
  top:20px;
  width:50px;height:50px;
  border-radius:50%;
  background:#fff;
  border:3px solid #fff;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:200;
  font-size:1.4rem;
}
#menu-btn{left:20px;display:none;}
#back-btn{right:20px;display:none;}

h2{font-size:4rem;margin-bottom:40px;}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<div id="menu-btn" class="btn">☰</div>
<div id="back-btn" class="btn">←</div>

<script>
const sentences=[
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro=document.getElementById("intro");
let s=0,c=0;

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,100);
 }else{
  if(s<sentences.length-1){
    setTimeout(erase,600);
  }else{
    setTimeout(initWelcome,600);
  }
 }
}
function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,50);
 }else{s++;type();}
}

function initWelcome(){
 document.getElementById("hero").remove();

 const welcome=document.createElement("section");
 welcome.className="page";
 welcome.id="welcome";
 welcome.innerHTML=`
  <h2>Welcome to my portfolio</h2>
  <div id="app">
    <ul>
      <li id="case">Case Studies</li>
      <li id="about">About</li>
      <span class="focus-el"></span>
    </ul>
  </div>`;
 document.body.appendChild(welcome);

 const focus=welcome.querySelector(".focus-el");
 const lis=[...welcome.querySelectorAll("li")];

 lis.forEach((li,i)=>{
   li.addEventListener("click",()=>{
     gsap.to(focus,{left:`${i*50}%`,duration:0.3,ease:"bounce.out"});
     if(li.id==="case") openPage("Case Studies","left");
     if(li.id==="about") openPage("About","right");
   });
 });
}

function openPage(title,direction){
 const welcome=document.getElementById("welcome");

 const page=document.createElement("section");
 page.className="page";
 page.innerHTML=`<h2>${title}</h2>`;
 document.body.appendChild(page);

 const fromX = direction==="left" ? "-100vw" : "100vw";
 const toX = direction==="left" ? "100vw" : "-100vw";

 gsap.to(welcome,{
   x:toX,
   duration:1,
   ease:"power2.inOut",
   onComplete:()=>welcome.remove()
 });

 gsap.fromTo(page,
   {x:fromX},
   {x:"0vw",duration:1,ease:"power2.inOut"}
 );

 document.getElementById("menu-btn").style.display="flex";
 document.getElementById("back-btn").style.display="flex";

 document.getElementById("back-btn").onclick=()=>{
   page.remove();
   initWelcome();
   document.getElementById("menu-btn").style.display="none";
   document.getElementById("back-btn").style.display="none";
 };
}

window.onload=type;
</script>
</body>
</html>

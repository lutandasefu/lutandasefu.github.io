<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;}

section{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  font-size:clamp(2.2rem,6vw,4.4rem);
}

/* ---------- INTRO FIX ---------- */
#introText{
  position:relative;
  display:inline-block;
}
#introText::after{
  content:"";
  width:2px;
  height:1em;
  background:#111;
  display:inline-block;
  margin-left:6px;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ---------- WELCOME ---------- */
#welcome{opacity:0;transition:.8s;z-index:4;}

#welcome-toggle{
  margin-top:40px;
  display:flex;
  position:relative;
  width:190px;height:60px;
  background:#fff;border-radius:50px;border:2px solid #fff;
}
#welcome-toggle .focus{
  position:absolute;top:6px;left:6px;
  width:78px;height:48px;border-radius:50px;
  background:#111;transition:.35s cubic-bezier(.77,0,.18,1);
}
#welcome-toggle button{
  flex:1;border:none;background:none;cursor:pointer;
  display:flex;justify-content:center;align-items:center;z-index:2;
}
#welcome-toggle svg{width:24px;height:24px;stroke:black;fill:none;transition:.3s;}
#welcome-toggle button.active svg{stroke:white;}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed;right:30px;top:50%;transform:translateY(-50%);
  width:75px;height:160px;background:#fff;border-radius:45px;
  display:none;flex-direction:column;border:2px solid #fff;z-index:10;
}
.right-focus{
  position:absolute;width:100%;height:50%;background:#111;
  transition:.35s cubic-bezier(.77,0,.18,1);
}
.right-toggle button{
  flex:1;border:none;background:none;cursor:pointer;
  display:flex;justify-content:center;align-items:center;z-index:2;
}
.right-toggle svg{width:28px;height:28px;stroke:black;fill:none;}
.right-toggle button.active svg{stroke:white;}

/* ---------- PAGES ---------- */
.page{
  background:#111;color:#fff;
  transform:translateX(100%);
  transition:.8s cubic-bezier(.77,0,.18,1);
  z-index:3;
}
</style>
</head>

<body class="grey-bg">

<section id="intro">
  <div id="introText"></div>
</section>

<section id="welcome">
  <div>Welcome to my portfolio</div>

  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>

    <button id="toCase">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>

    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<section id="case" class="page">Case Studies</section>
<section id="about" class="page">About</section>

<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>
  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
const introText=document.getElementById("introText");
const lines=["Hi there...","I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type(){
 if(c<lines[l].length){
   introText.textContent+=lines[l][c++];
   setTimeout(type,80);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}
   else{setTimeout(showWelcome,800);}
 }
}
function erase(){
 if(c>0){introText.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}
function showWelcome(){
 document.getElementById("intro").style.opacity=0;
 setTimeout(()=>{document.getElementById("welcome").style.opacity=1;},600);
}
type();

/* NAVIGATION */
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const rFocus=document.getElementById("rFocus");
const right=document.getElementById("rightToggle");

function activate(btnA,btnB,move){
 btnA.classList.add("active");
 btnB.classList.remove("active");
 rFocus.style.transform=move;
 document.body.classList.remove("grey-bg");
 document.body.classList.add("black-bg");
}

document.getElementById("toCase").onclick=()=>{
 document.getElementById("wFocus").style.transform="translateX(0)";
 right.style.display="flex";
 casePage.style.transform="translateX(0)";
 activate(caseBtn,aboutBtn,"translateY(0)");
}

document.getElementById("toAbout").onclick=()=>{
 document.getElementById("wFocus").style.transform="translateX(100%)";
 right.style.display="flex";
 aboutPage.style.transform="translateX(0)";
 activate(aboutBtn,caseBtn,"translateY(100%)");
}

const caseBtn=document.getElementById("caseBtn");
const aboutBtn=document.getElementById("aboutBtn");

caseBtn.onclick=()=>{
 casePage.style.transform="translateX(0)";
 aboutPage.style.transform="translateX(100%)";
 activate(caseBtn,aboutBtn,"translateY(0)");
}

aboutBtn.onclick=()=>{
 aboutPage.style.transform="translateX(0)";
 casePage.style.transform="translateX(-100%)";
 activate(aboutBtn,caseBtn,"translateY(100%)");
}
</script>

</body>
</html>

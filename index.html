<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with Liquid Gradient Background</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    /* Navbar Styles */
    .navbar {
      border-radius: 32px;
      background-color: rgba(255, 255, 255, 0.85);
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 10px 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    .list-item {
      list-style: none;
      flex-basis: 100%;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #555;
      transform: translateY(0);
      transition: transform 0.5s ease, color 0.2s ease;
      cursor: pointer;
    }

    .list-item-name {
      font-size: 13px;
      font-weight: 500;
      position: absolute;
      transform: translateY(50px);
      transition: transform 0.5s ease, opacity 0.2s ease;
      opacity: 0;
    }

    .list-item:hover {
      color: #5756e6;
      transform: translateY(-6px);
    }

    .list-item:hover .list-item-name {
      transform: translateY(20px);
      opacity: 1;
    }

    /* Canvas takes full screen */
    #liquid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>
<body>

  <!-- Liquid Gradient Background Canvas -->
  <canvas id="liquid-bg"></canvas>

  <!-- Navbar -->
  <div class="navbar">
    <li class="list-item"><i class="fa-solid fa-house"></i>
      <span class="list-item-name">Home</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-user"></i>
      <span class="list-item-name">Profile</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-gear"></i>
      <span class="list-item-name">Settings</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-bag-shopping"></i>
      <span class="list-item-name">Bag</span>
    </li>
  </div>

  <!-- Three.js and Liquid Gradient JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script>
    // Basic liquid gradient from first color scheme
    const canvas = document.getElementById('liquid-bg');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);

    camera.position.z = 2;

    const geometry = new THREE.PlaneGeometry(2, 2);
    const material = new THREE.ShaderMaterial({
      uniforms: {
        u_time: {value: 0},
        u_resolution: {value: new THREE.Vector2(window.innerWidth, window.innerHeight)}
      },
      vertexShader: `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float u_time;
        uniform vec2 u_resolution;

        void main() {
          vec2 st = gl_FragCoord.xy/u_resolution;
          vec3 color = vec3(0.2, 0.5, 0.9); // first color scheme only
          float wave = sin(st.x*10.0 + u_time) * 0.1 + cos(st.y*10.0 + u_time) * 0.1;
          color += wave;
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });

    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    function animate(time){
      material.uniforms.u_time.value = time * 0.001;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>

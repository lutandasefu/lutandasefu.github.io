<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ddd;
  transition:opacity 1.2s ease;
}
.hero.fade-out{opacity:0}

h1{
  font-size:5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
}
.typing{animation:blink .7s step-end infinite}
.cursor-end{animation:blink .7s step-end 3 forwards}
@keyframes blink{
  0%,50%,100%{border-color:#333}
  25%,75%{border-color:transparent}
}

/* NEXT SECTION */
.next{
  position:absolute;
  inset:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#ddd;
  opacity:0;
  transition:opacity 1.2s ease;
}
.next.show{opacity:1}

.next h2{
  font-size:5rem;
  margin-bottom:60px;
}

/* MENU */
#app{
  width:560px;
  height:70px;
  display:grid;
  place-items:center;
}

#app ul{
  position:relative;
  width:100%;
  height:70px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-radius:45px;
  background:rgba(255,255,255,.65);
  transform-origin:center;
  transform:perspective(1000px) rotateY(0deg);
  overflow:hidden;
  padding:0 25px; /* breathing space */
}

#app li{
  list-style:none;
  display:grid;
  place-items:center;
  font-size:1.25rem;
  font-weight:500;
  color:#333;
  cursor:pointer;
  z-index:10;
}

.focus-el{
  position:absolute;
  left:25px;
  top:0;
  width:calc((100% - 50px)/3);
  height:100%;
  border-radius:45px;
  background:#fff;
}
</style>
</head>

<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences=[
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro=document.getElementById("intro");
const hero=document.getElementById("hero");
let s=0,c=0;

function rand(){return 110+Math.random()*40}

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 }else{
  if(s<sentences.length-1){
    setTimeout(erase,700);
  }else{
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(fadeHero,1000);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 }else{
  s++; setTimeout(type,rand());
 }
}

function fadeHero(){
 hero.classList.add("fade-out");

 const next=document.createElement("section");
 next.className="next";
 next.innerHTML=`
  <h2>Welcome to my portfolio</h2>
  <div id="app">
    <ul>
      <li>Case Studies</li>
      <li>About</li>
      <li>Contact</li>
      <span class="focus-el"></span>
    </ul>
  </div>
 `;
 document.body.appendChild(next);
 setTimeout(()=>next.classList.add("show"),800);
 document.body.style.overflow="auto";

 // menu animation
 const ul=next.querySelector("ul");
 const lis=[...ul.querySelectorAll("li")];
 const focus=ul.querySelector(".focus-el");
 const rect=ul.getBoundingClientRect();
 let active=0;

 lis.forEach((li,i)=>{
  li.addEventListener("click",()=>{
   if(i===active) return;
   const x=i===0?-1:1;
   active=i;
   const liRect=li.getBoundingClientRect();
   gsap.to(ul,{duration:.5,rotateY:`${x*25}deg`});
   gsap.to(focus,{
     duration:.75,
     left:`${liRect.left-rect.left}px`,
     ease:"bounce.out"
   });
   gsap.to(ul,{duration:.5,rotateY:`0deg`,delay:.5});
  });
 });
}

window.onload=type;
</script>

</body>
</html>

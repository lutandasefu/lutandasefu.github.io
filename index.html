<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | UI/UX Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

  <style>
    /* Reset and body */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif; /* default for static text */
      background-color: #ffffff;
      color: #111;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    /* Typed text */
    .hero h1 {
      font-family: 'Sulphur Point', sans-serif; /* typed text font */
      font-weight: 300;
      font-size: 4rem;
      display: inline-block;
      border-right: 2px solid #111; /* cursor */
      white-space: nowrap;
      overflow: hidden;
    }

    /* Static subtitle */
    .hero p {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 1.75rem;
      color: #555;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 2.5s; /* subtitle fades after first sentence */
    }

    /* Fade-in animation */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Blinking cursor */
    @keyframes blink {
      0%, 50%, 100% { border-color: #111; }
      25%, 75% { border-color: transparent; }
    }

    .typing {
      border-right: 2px solid #111;
      animation: blink 0.7s step-end infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
      .hero p { font-size: 1.25rem; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2.5rem; }
      .hero p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1 id="intro" class="typing"></h1>
    <p>UI/UX Designer</p>
  </section>

  <script>
    // Sentences for typing animation
    const sentences = [
      "Hey, I'm Lutanda",
      "A UI/UX designer",
      "I design for clarity and purpose"
    ];

    const introEl = document.getElementById("intro");
    let sentenceIndex = 0;
    let charIndex = 0;
    const typingSpeed = 100; // ms per character
    const erasingSpeed = 50;
    const delayBetween = 1500; // pause before erase

    function typeSentence() {
      if (charIndex < sentences[sentenceIndex].length) {
        introEl.textContent += sentences[sentenceIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeSentence, typingSpeed);
      } else {
        setTimeout(eraseSentence, delayBetween);
      }
    }

    function eraseSentence() {
      if (charIndex > 0) {
        introEl.textContent = sentences[sentenceIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseSentence, erasingSpeed);
      } else {
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(typeSentence, typingSpeed);
      }
    }

    window.onload = () => typeSentence();
  </script>

</body>
</html>

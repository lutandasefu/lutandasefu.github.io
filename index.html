<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@100;300&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/6b8b2c6e52.js" crossorigin="anonymous"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  background:#111;
  color:#fff;
  overflow:hidden;
}

/* ===== CASE STUDIES PAGE ===== */
.casePage{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}

/* container from CodePen logic */
.cases{
  width:90%;
  height:85vh;
  display:flex;
  gap:12px;
}

/* each row */
.case{
  flex:1;
  border-radius:20px;
  background:#1b1b1b;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.8rem;
  font-family:'Urbanist',sans-serif;
  font-weight:300;
  cursor:pointer;
  transition:flex 0.6s cubic-bezier(.77,0,.18,1), background 0.5s;
  position:relative;
  overflow:hidden;
}

/* label text */
.case span{
  z-index:2;
  pointer-events:none;
}

/* expansion like CodePen */
.case:hover{
  flex:6;
  background:#fff;
  color:#111;
}

/* inner expanding panel */
.caseContent{
  position:absolute;
  inset:0;
  opacity:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2rem;
  transition:opacity .4s ease .3s;
}

/* show content when expanded */
.case:hover .caseContent{
  opacity:1;
}

/* collapse siblings */
.cases:hover .case:not(:hover){
  flex:0.8;
}

/* ===== ICON TOGGLE (right side) ===== */
.iconToggle{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  width:70px;
  height:180px;
  background:#000;
  border-radius:50px;
  border:2px solid #fff;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.iconToggle i{
  font-size:1.6rem;
  color:#fff;
  cursor:pointer;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .cases{flex-direction:column;}
  .case:hover{flex:4;}
  .cases:hover .case:not(:hover){flex:1;}
}
</style>
</head>
<body>

<!-- CASE STUDIES PAGE -->
<section class="casePage">

  <div class="cases">
    <div class="case"><span>Case Study 1</span><div class="caseContent"></div></div>
    <div class="case"><span>Case Study 2</span><div class="caseContent"></div></div>
    <div class="case"><span>Case Study 3</span><div class="caseContent"></div></div>
    <div class="case"><span>Case Study 4</span><div class="caseContent"></div></div>
    <div class="case"><span>Case Study 5</span><div class="caseContent"></div></div>
    <div class="case"><span>Case Study 6</span><div class="caseContent"></div></div>
  </div>

</section>

<!-- ICON TOGGLE -->
<div class="iconToggle">
  <i class="fa-solid fa-layer-group" title="Case Studies"></i>
  <i class="fa-solid fa-user" title="About"></i>
</div>

</body>
</html>

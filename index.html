<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lutanda | UI/UX Portfolio Animation</title>

  <link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Sulphur Point',sans-serif;
      background:#ddd;
      color:#333;
      overflow:hidden; /* disable scroll until animation done */
    }

    .hero{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    h1{
      font-size:5rem;
      font-weight:300;
      border-right:2px solid #333;
      white-space:nowrap;
      transition:opacity 1s ease, transform 1s ease;
    }

    @keyframes blink {
      0%,50%,100% { border-color:#333; }
      25%,75% { border-color:transparent; }
    }

    .typing { animation:blink .7s step-end infinite; }
    .cursor-end { animation:blink .7s step-end 3; }
    .fade-out {
      opacity:0;
      transform:translateY(-60px);
    }

    /* NAV hidden until scroll back to top */
    .navbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      width:90%;
      max-width:420px;
      margin:1rem auto;
      font-family:'Inter',sans-serif;
      opacity:0;
      transform:translateY(-30px);
      transition:opacity .8s ease, transform .8s ease;
    }
    .navbar.visible {
      opacity:1;
      transform:translateY(0);
    }
    .navbar li {
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      cursor:pointer;
      font-size:1rem;
      color:#555;
      transition:color .2s ease;
    }
    .navbar li:hover { color:#5756e6; }

    /* NEXT SECTION */
    .next {
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:2.5rem;
      background:#bbb;
      opacity:0;
      transform:translateY(80px);
      transition:opacity 1.4s ease, transform 1.4s ease;
    }
    .next.show {
      opacity:1;
      transform:translateY(0);
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">
    <h1 id="intro" class="typing"></h1>
  </section>

  <script>
    const sentences = [
      "Hey, I'm Lutanda",
      "A UI/UX designer",
      "I design for clarity",
      "And purpose."
    ];

    const intro = document.getElementById("intro");
    const hero = document.getElementById("hero");

    let s=0, c=0;

    function randSpeed() { return 100 + Math.random() * 40; }

    function type() {
      if (c < sentences[s].length) {
        intro.textContent += sentences[s][c++];
        setTimeout(type, randSpeed());
      } else {
        if (s < sentences.length - 1) {
          setTimeout(erase, 1400);
        } else {
          intro.classList.remove("typing");
          intro.classList.add("cursor-end");

          // 3 cursor blinks complete
          setTimeout(() => {
            intro.classList.add("fade-out");

            setTimeout(createNext, 1200);
          }, 2100);
        }
      }
    }

    function erase() {
      if (c > 0) {
        intro.textContent = sentences[s].substring(0, --c);
        setTimeout(erase, 70);
      } else {
        s++;
        setTimeout(type, randSpeed());
      }
    }

    function createNext() {
      // allow scrolling now
      document.body.style.overflow="auto";

      // build navbar
      const nav = document.createElement("ul");
      nav.className="navbar";
      nav.innerHTML = `
        <li><i class="fa-solid fa-house"></i>Home</li>
        <li><i class="fa-solid fa-user"></i>Profile</li>
        <li><i class="fa-solid fa-gear"></i>Settings</li>
        <li><i class="fa-solid fa-bag-shopping"></i>Bag</li>
      `;
      hero.appendChild(nav);

      // build next section
      const next = document.createElement("section");
      next.className="next";
      next.innerText="Welcome to my portfolio";
      document.body.appendChild(next);

      // scroll and reveal
      next.scrollIntoView({ behavior:"smooth" });
      setTimeout(()=> next.classList.add("show"), 500);

      // show navbar only when back at top
      window.addEventListener("scroll", function() {
        if (window.scrollY < 40) {
          nav.classList.add("visible");
        } else {
          nav.classList.remove("visible");
        }
      });
    }

    window.onload = type;
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sulphur Point',sans-serif;overflow:hidden;}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;}

/* ---------- INTRO ---------- */
#intro{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:5;
}
#introTextWrapper{
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(2.2rem,6vw,4.4rem);
}
#introText { display:inline-block; }
.cursor {
  width:2px;
  height:1em;
  background:#111;
  display:inline-block;
  margin-left:6px;
  animation: blink 0.7s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ---------- WELCOME ---------- */
#welcome{
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  min-height:100vh;
  opacity:0;
  transition:opacity .8s ease, transform .8s ease;
  z-index:4;
}
#welcome div{
  margin-bottom:30px; /* Reduced from 50px */
  font-size:clamp(3rem,6vw,5rem);
  color:#111;
  text-align:center;
  font-weight:500;
}

/* ---------- WELCOME TOGGLE ---------- */
#welcome-toggle{
  display:flex;
  position:relative;
  width:190px; height:60px;
  background:#fff;
  border-radius:50px;
  border:2px solid #fff;
}
#welcome-toggle .focus{
  position:absolute; top:6px; left:6px;
  width:78px; height:48px; border-radius:50px;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
#welcome-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
  padding:0;
}
#welcome-toggle button svg{
  width:24px; height:24px;
  stroke:#111;
  fill:none;
  transition:stroke .3s ease;
}
#welcome-toggle button.active svg{
  stroke:#fff;
}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed;
  right:30px; top:50%;
  transform:translateY(-50%);
  width:75px; height:160px;
  background:#fff;
  border-radius:45px;
  display:none;
  flex-direction:column;
  border:2px solid #fff;
  z-index:10;
}
.right-toggle .right-focus{
  position:absolute; top:0; left:0;
  width:100%; height:50%;
  background:#111;
  border-radius:45px; /* Rounded movable focus */
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
.right-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}
.right-toggle button svg{
  width:28px; height:28px;
  stroke:#111;
  fill:none;
  transition:stroke .3s ease;
}
.right-toggle button.active svg{
  stroke:#fff;
}

/* ---------- PAGES ---------- */
.page{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:#111; color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(2rem,5vw,3rem);
  transform:translateX(100%);
  transition:.8s cubic-bezier(.77,0,.18,1);
  z-index:3;
}

/* ---------- CAROUSEL ---------- */
.carousel{
  position:absolute;
  bottom:10%; width:80%; height:200px;
  opacity:0; transform:scale(.8);
  transition:.5s ease;
  display:flex; gap:20px; justify-content:center;
}
.carousel img{
  width:200px; height:120px;
  object-fit:cover;
  border-radius:12px;
}
.showCarousel{
  opacity:1;
  transform:scale(1);
}
</style>
</head>

<body class="grey-bg">

<!-- ---------- INTRO ---------- -->
<section id="intro">
  <div id="introTextWrapper">
    <span id="introText"></span>
    <span class="cursor"></span>
  </div>
</section>

<!-- ---------- WELCOME ---------- -->
<section id="welcome">
  <div>Welcome to my portfolio</div>
  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>
    <button id="toCase">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>
    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<!-- ---------- PAGES ---------- -->
<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>
  <div class="carousel" id="carousel">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>
</section>

<section id="about" class="page">About</section>

<!-- ---------- RIGHT TOGGLE ---------- -->
<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>
  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5" fill="none">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
/* ---------- TYPING INTRO WITH CURSOR ---------- */
const introText = document.getElementById("introText");
const welcome = document.getElementById("welcome");
const lines = ["Hi there, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0, c=0;

function type() {
  if(c < lines[l].length){
    introText.textContent += lines[l][c++];
    setTimeout(type, 80);
  } else {
    if(l < lines.length - 1){
      setTimeout(erase, 600);
    } else {
      setTimeout(showWelcome, 800);
    }
  }
}

function erase() {
  if(c > 0){
    introText.textContent = lines[l].substring(0, --c);
    setTimeout(erase, 40);
  } else {
    l++; 
    type();
  }
}

function showWelcome(){
  intro.style.opacity = 0;
  setTimeout(()=>{
    intro.remove();
    welcome.style.opacity = 1;
  },600);
}

type();

/* ---------- NAVIGATION ---------- */
const casePage = document.getElementById("case");
const aboutPage = document.getElementById("about");
const right = document.getElementById("rightToggle");
const rFocus = document.getElementById("rFocus");
const wFocus = document.getElementById("wFocus");

const caseBtn = document.getElementById("caseBtn");
const aboutBtn = document.getElementById("aboutBtn");
const toCase = document.getElementById("toCase");
const toAbout = document.getElementById("toAbout");

toCase.classList.add("active");

function setWelcomeActive(activeBtn, inactiveBtn){
  wFocus.style.transform = activeBtn===toCase ? "translateX(0)" : "translateX(100%)";
  activeBtn.classList.add("active");
  inactiveBtn.classList.remove("active");
}

function activateBlackBg(){
  document.body.classList.remove("grey-bg");
  document.body.classList.add("black-bg");
}

function showCase(){
  activateBlackBg();
  casePage.style.transform = "translateX(0)";
  aboutPage.style.transform = "translateX(100%)";
  rFocus.style.transform = "translateY(0)";
  caseBtn.classList.add("active");
  aboutBtn.classList.remove("active");
}

function showAbout(){
  activateBlackBg();
  aboutPage.style.transform = "translateX(0)";
  casePage.style.transform = "translateX(-100%)";
  rFocus.style.transform = "translateY(100%)";
  aboutBtn.classList.add("active");
  caseBtn.classList.remove("active");
}

toCase.onclick = () => {
  setWelcomeActive(toCase, toAbout);
  welcome.style.transform = "translateY(-100%)";
  right.style.display = "flex";
  showCase();
};

toAbout.onclick = () => {
  setWelcomeActive(toAbout, toCase);
  welcome.style.transform = "translateY(-100%)";
  right.style.display = "flex";
  showAbout();
};

caseBtn.onclick = showCase;
aboutBtn.onclick = showAbout;

/* ---------- CAROUSEL HOVER ---------- */
const title = document.getElementById("caseTitle");
const carousel = document.getElementById("carousel");

title.onmouseenter = () => carousel.classList.add("showCarousel");
title.onmouseleave = () => carousel.classList.remove("showCarousel");
</script>

</body>
</html>

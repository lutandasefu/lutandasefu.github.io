<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
}

/* ---------- MASTER WRAPPER ---------- */
.wrapper{
  height:400vh;
  width:100%;
  transition:transform 1s cubic-bezier(.77,0,.18,1);
}

/* ---------- SECTIONS ---------- */
section{
  height:100vh;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:clamp(2rem,6vw,4rem);
}

/* ---------- INTRO ---------- */
#intro{
  border-right:2px solid #111;
  animation:blink .7s step-end infinite;
}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME TOGGLE ---------- */
.welcome-switch{
  margin-top:40px;
  width:170px;
  height:60px;
  background:#fff;
  border-radius:50px;
  position:relative;
  display:flex;
  border:2px solid #fff;
}
.focus{
  position:absolute;
  top:5px;
  left:5px;
  width:75px;
  height:50px;
  border-radius:50px;
  background:#111;
  transition:transform .3s;
}
.welcome-switch button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  z-index:1;
  display:flex;
  justify-content:center;
  align-items:center;
}
.welcome-switch svg{
  width:26px;
  height:26px;
  stroke:black;
  transition:.3s;
}
.welcome-switch button.active svg{
  stroke:white;
}

/* ---------- CASE / ABOUT ---------- */
.page{background:#111;color:#fff;}

.right-toggle{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  width:70px;
  height:150px;
  background:#fff;
  border-radius:45px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:2px solid #fff;
}
.right-focus{
  position:absolute;
  width:100%;
  height:50%;
  background:#000;
  transition:transform .3s;
}
.right-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  z-index:1;
  display:flex;
  justify-content:center;
  align-items:center;
}
.right-toggle svg{
  width:26px;
  height:26px;
  stroke:black;
  transition:.3s;
}
.right-toggle button.active svg{
  stroke:white;
}
</style>
</head>
<body>

<div class="wrapper" id="wrap">

  <section id="introSection">
    <div id="intro"></div>
  </section>

  <section id="welcome">
    <div>Welcome to my portfolio</div>

    <div class="welcome-switch">
      <div class="focus" id="wFocus"></div>

      <button id="toCase">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
          <rect x="3" y="4" width="14" height="14" rx="2"/>
          <path d="M7 8h6M7 12h6M7 16h4"/>
        </svg>
      </button>

      <button id="toAbout">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c2-4 14-4 16 0"/>
        </svg>
      </button>

    </div>
  </section>

  <section id="case" class="page">Case Studies</section>
  <section id="about" class="page">About</section>
</div>

<!-- Right Toggle -->
<div class="right-toggle" id="rightToggle" style="display:none;">
  <div class="right-focus" id="rFocus"></div>

  <button id="caseBtn">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>

  <button id="aboutBtn">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
const wrap=document.getElementById('wrap');
const intro=document.getElementById("intro");
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,80);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}
   else{setTimeout(()=>wrap.style.transform="translateY(-100vh)",700);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}
type();

/* Welcome toggle FIXED */
const wFocus=document.getElementById('wFocus');
const toCase=document.getElementById('toCase');
const toAbout=document.getElementById('toAbout');

wFocus.style.transform="translateX(0)";
toCase.classList.add('active');

toCase.onclick=()=>{
  wFocus.style.transform="translateX(0)";
  toCase.classList.add('active');
  toAbout.classList.remove('active');
  wrap.style.transform="translateY(-200vh)";
  showRight("case");
}
toAbout.onclick=()=>{
  wFocus.style.transform="translateX(100%)";
  toAbout.classList.add('active');
  toCase.classList.remove('active');
  wrap.style.transform="translateY(-300vh)";
  showRight("about");
}

/* Right toggle */
const right=document.getElementById("rightToggle");
const rFocus=document.getElementById("rFocus");
const caseBtn=document.getElementById("caseBtn");
const aboutBtn=document.getElementById("aboutBtn");

function showRight(page){
  right.style.display="flex";
  if(page==="case"){
    rFocus.style.transform="translateY(0)";
    caseBtn.classList.add("active");
    aboutBtn.classList.remove("active");
  }else{
    rFocus.style.transform="translateY(100%)";
    aboutBtn.classList.add("active");
    caseBtn.classList.remove("active");
  }
}

caseBtn.onclick=()=>{
  wrap.style.transform="translateY(-200vh)";
  showRight("case");
}
aboutBtn.onclick=()=>{
  wrap.style.transform="translateY(-300vh)";
  showRight("about");
}
</script>

</body>
</html>

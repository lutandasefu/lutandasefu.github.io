<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Sulphur Point', sans-serif;
  background: #ddd;
  color: #333;
  overflow: hidden;
  scroll-behavior: smooth;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ddd;
  transition: opacity 1.2s ease;
}

.hero.fade-out {
  opacity: 0;
}

h1 {
  font-size: 5rem;
  font-weight: 300;
  border-right: 2px solid #333;
  white-space: nowrap;
}

.typing { animation: blink 0.7s step-end infinite; }
.cursor-end { animation: blink-3 0.7s step-end 3 forwards; }

@keyframes blink {
  0%,50%,100% { border-color: #333; }
  25%,75% { border-color: transparent; }
}

@keyframes blink-3 {
  0%,50%,100% { border-color: #333; }
  25%,75% { border-color: transparent; }
}

/* NEXT SECTION */
.next {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #ddd;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.next.show {
  opacity: 1;
}

.next h2 {
  font-size: 5rem;
  margin-bottom: 50px;
  text-align: center;
  color: #333;
}

/* UPDATED MENU WITH BORDER */
#app {
  width: 600px;                /* slightly bigger to fit words comfortably */
  height: 70px;
  display: grid;
  place-items: center;
  border: 3px solid #333;      /* menu border */
  border-radius: 50px;
  background: #fff;
}

#app ul {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-radius: 50px;
  overflow: hidden;
  transform-origin: center;
  transform: perspective(1000px) rotateY(0deg);
}

#app li {
  list-style: none;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  font-family: 'Sulphur Point', sans-serif;
  font-weight: 500;
  text-transform: capitalize;
  color: #333;
  cursor: pointer;
  z-index: 10;
}

.focus-el {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: 50px;
  background: #ddd; /* match background so it feels inset */
  transition: left 0.75s ease;
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences = [
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
let s=0,c=0;

function rand(){ return 110 + Math.random()*40; }

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 } else {
  if(s<sentences.length-1){
    setTimeout(erase,700);
  } else {
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(fadeHero,1000);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 } else {
  s++;
  setTimeout(type,rand());
 }
}

function fadeHero(){
  hero.classList.add("fade-out");

  const next=document.createElement("section");
  next.className="next";
  next.innerHTML=`
    <h2>Welcome to my portfolio</h2>
    <div id="app">
      <ul>
        <li>Case Studies</li>
        <li>About</li>
        <li>Contact</li>
        <span class="focus-el"></span>
      </ul>
    </div>
  `;
  document.body.appendChild(next);

  setTimeout(()=>next.classList.add("show"),800);
  document.body.style.overflow="auto";

  // Recalculate focus element for 3 items evenly
  const ul = next.querySelector("ul");
  const lis = [...ul.querySelectorAll("li")];
  const focus = ul.querySelector(".focus-el");
  const width = ul.clientWidth / lis.length;

  focus.style.width = width + "px";

  let activeIndex = 0;
  lis.forEach((li,index)=>{
    li.addEventListener("click",()=>{
      if(index===activeIndex) return;
      const x = index===0 ? -1 : 1;
      activeIndex=index;
      const liRect = li.getBoundingClientRect();
      const ulRect = ul.getBoundingClientRect();
      gsap.to(ul,{duration:0.5,rotateY:`${x*25}deg`});
      gsap.to(focus,{duration:0.75,left:`${(ulRect.width/3)*index}px`,ease:"bounce.out"});
      gsap.to(ul,{duration:0.5,rotateY:"0deg",delay:0.5});
    });
  });
}

window.onload=type;
</script>

</body>
</html>

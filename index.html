<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | UI/UX Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    /* Reset and body */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #111;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      display: inline-block;
      border-right: 2px solid #111; /* cursor */
      white-space: nowrap;
      overflow: hidden;
    }

    .hero p {
      font-size: 1.75rem;
      font-weight: 400;
      color: #555;
      margin-top: 1rem;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 2.5s; /* after typing */
    }

    /* Fade-in animation */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Blinking cursor animation */
    @keyframes blink {
      0%, 50%, 100% { border-color: #111; }
      25%, 75% { border-color: transparent; }
    }

    .hero h1.typing {
      border-right: 2px solid #111;
      animation: blink 0.7s step-end infinite;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 { font-size: 3rem; }
      .hero p { font-size: 1.25rem; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 2.5rem; }
      .hero p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1 id="intro" class="typing"></h1>
    <p>UI/UX Designer & Web Developer</p>
  </section>

  <script>
    // Typing animation
    const text = "Hello, I’m Your Name";
    const introEl = document.getElementById("intro");
    let index = 0;

    function type() {
      if (index < text.length) {
        introEl.innerHTML += text.charAt(index);
        index++;
        setTimeout(type, 120); // typing speed
      } else {
        introEl.classList.remove("typing"); // stop cursor blink
      }
    }

    window.onload = type;
  </script>

</body>
</html>

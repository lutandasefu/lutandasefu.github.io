<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
}

/* ---------- SECTIONS ---------- */
section{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  font-size:clamp(2.2rem,6vw,4.4rem);
}

/* ---------- INTRO ---------- */
#intro{
  border-right:2px solid #111;
  animation:blink .7s step-end infinite;
  background:#e6e6e6;
  z-index:5;
}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME ---------- */
#welcome{
  opacity:0;
  transition:opacity .8s ease, transform .8s ease;
  z-index:4;
}

/* ---------- TOGGLES ---------- */
.welcome-switch{
  margin-top:40px;
  width:180px;
  height:65px;
  background:#fff;
  border-radius:50px;
  position:relative;
  display:flex;
  border:2px solid #fff;
}
.focus{
  position:absolute;
  top:5px;
  left:5px;
  width:85px;
  height:55px;
  border-radius:50px;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
button{
  flex:1;border:none;background:none;cursor:pointer;
  display:flex;justify-content:center;align-items:center;z-index:1;
}
svg{width:28px;height:28px;stroke:black;transition:.3s;}
button.active svg{
  stroke:white !important;
}

/* ---------- PAGES ---------- */
.page{
  background:#111;
  color:#fff;
  transform:translateX(100%);
  transition:transform .8s cubic-bezier(.77,0,.18,1);
  z-index:3;
}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed;
  right:30px;
  top:50%;
  transform:translateY(-50%);
  width:75px;
  height:160px;
  background:#fff;
  border-radius:45px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  border:2px solid #fff;
  z-index:10;
}
.right-focus{
  position:absolute;
  width:100%;
  height:50%;
  background:#000;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}

/* ---------- CAROUSEL ---------- */
.carousel{
  position:absolute;
  bottom:10%;
  width:80%;
  height:200px;
  opacity:0;
  transform:scale(.8);
  transition:.5s ease;
  display:flex;
  gap:20px;
  justify-content:center;
}
.carousel img{
  width:200px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
}
.showCarousel{
  opacity:1;
  transform:scale(1);
}
</style>
</head>
<body>

<section id="intro"></section>

<section id="welcome">
  <div>Welcome to my portfolio</div>

  <div class="welcome-switch">
    <div class="focus" id="wFocus"></div>

    <button id="toCase">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>

    <button id="toAbout">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>

  <div class="carousel" id="carousel">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>
</section>

<section id="about" class="page">About</section>

<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>

  <button id="caseBtn">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>

  <button id="aboutBtn">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
/* ---------- TYPE INTRO ---------- */
const intro=document.getElementById("intro");
const welcome=document.getElementById("welcome");
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,80);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}
   else{setTimeout(showWelcome,800);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}
function showWelcome(){
 intro.style.opacity=0;
 setTimeout(()=>{
   intro.remove();
   welcome.style.opacity=1;
 },600);
}
type();

/* ---------- ACTIVE STATE FUNCTION ---------- */
function setActive(btn1, btn2){
  btn1.classList.add("active");
  btn2.classList.remove("active");
  // force icon color
  btn1.querySelector("svg").style.stroke = "white";
  btn2.querySelector("svg").style.stroke = "black";
}

/* ---------- PAGE SYSTEM ---------- */
const casePage=document.getElementById("case");
const aboutPage=document.getElementById("about");
const right=document.getElementById("rightToggle");
const rFocus=document.getElementById("rFocus");

function showCase(){
  casePage.style.transform="translateX(0)";
  aboutPage.style.transform="translateX(100%)";
  rFocus.style.transform="translateY(0)";
  setActive(caseBtn, aboutBtn);
}
function showAbout(){
  aboutPage.style.transform="translateX(0)";
  casePage.style.transform="translateX(-100%)";
  rFocus.style.transform="translateY(100%)";
  setActive(aboutBtn, caseBtn);
}

/* ---------- WELCOME TOGGLE ---------- */
const wFocus=document.getElementById('wFocus');
const toCase=document.getElementById('toCase');
const toAbout=document.getElementById('toAbout');
const caseBtn=document.getElementById("caseBtn");
const aboutBtn=document.getElementById("aboutBtn");

toCase.onclick=()=>{
  wFocus.style.transform="translateX(0)";
  welcome.style.transform="translateY(-100%)";
  right.style.display="flex";
  setActive(toCase, toAbout);
  showCase();
}
toAbout.onclick=()=>{
  wFocus.style.transform="translateX(100%)";
  welcome.style.transform="translateY(-100%)";
  right.style.display="flex";
  setActive(toAbout, toCase);
  showAbout();
}

/* ---------- RIGHT TOGGLE ---------- */
caseBtn.onclick=showCase;
aboutBtn.onclick=showAbout;

/* ---------- CAROUSEL HOVER ---------- */
const title=document.getElementById("caseTitle");
const carousel=document.getElementById("carousel");

title.onmouseenter=()=>carousel.classList.add("showCarousel");
title.onmouseleave=()=>carousel.classList.remove("showCarousel");
</script>

</body>
</html>

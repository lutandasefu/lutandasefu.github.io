<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#e6e6e6;font-family:'Sulphur Point',sans-serif;transition:background .6s ease;}
section{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;text-align:center;}
#intro{font-size:clamp(2rem,6vw,4.2rem);border-right:2px solid #111;animation:blink .7s step-end infinite;}
@keyframes blink{50%{border-color:transparent;}}
.welcome{flex-direction:column;gap:35px;font-size:clamp(2.2rem,6vw,4.4rem);opacity:0;transition:opacity .8s ease;}
.menu{width:90%;max-width:520px;height:70px;background:#fff;border-radius:45px;position:relative;display:grid;grid-template-columns:repeat(2,1fr);overflow:hidden;font-family:'Urbanist',sans-serif;}
.menu div{display:grid;place-items:center;font-size:clamp(1rem,2.5vw,1.2rem);color:#666;cursor:pointer;z-index:2;}
.focus{position:absolute;left:0;top:0;width:50%;height:100%;background:#f2f2f2;border-radius:45px;transition:transform .6s cubic-bezier(.77,0,.18,1);}

.iconToggle{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:2000;display:none;}
.switch{width:70px;height:150px;background:#fff;border-radius:45px;display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;border:2px solid #fff;}
.switch-focus{position:absolute;top:0;left:0;width:100%;height:50%;background:#ccc;border-radius:45px;transition:transform 0.3s ease;z-index:0;}
.switch-btn{border:none;background:transparent;color:#000;display:flex;align-items:center;justify-content:center;z-index:1;cursor:pointer;}
.switch-btn svg{width:32px;height:32px;fill:black;}

.page{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:#111;color:#fff;font-size:clamp(2rem,6vw,4rem);transform:translateX(100%);transition:transform .8s ease;z-index:1000;flex-direction:column;}
.page-text{cursor:pointer;color:#fff;font-size:2rem;margin-bottom:20px;position:relative;}
.carousel{display:none;margin-top:20px;width:90%;max-width:600px;overflow:hidden;border-radius:15px;position:relative;}
.carousel-track{display:flex;transition:transform 0.5s ease-in-out;}
.carousel-item{min-width:100%;flex-shrink:0;background:#222;color:#fff;font-size:1.5rem;display:flex;justify-content:center;align-items:center;height:200px;border-radius:10px;}
.carousel-nav{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;transform:translateY(-50%);padding:0 15px;}
.carousel-nav button{background:rgba(0,0,0,0.2);border:none;color:#fff;font-size:2rem;border-radius:50%;cursor:pointer;}

@media(max-width:600px){.iconToggle{right:15px;}.switch{width:55px;height:120px;}.switch-btn svg{width:24px;height:24px;}.carousel-item{height:150px;font-size:1.2rem;}.menu{height:60px;}}
</style>
</head>
<body>

<!-- Phase 1: Intro -->
<section id="hero"><div id="intro"></div></section>

<!-- Phase 2: Welcome -->
<section class="welcome" id="welcome">
  <div>Welcome to my portfolio</div>
  <div class="menu" id="menu">
    <div class="focus" id="focus"></div>
    <div id="caseBtn">Case Studies</div>
    <div id="aboutBtn">About</div>
  </div>
</section>

<!-- Switch-Style Toggle -->
<div class="iconToggle" id="iconToggle">
  <div class="switch">
    <div class="switch-focus" id="switchFocus"></div>
    <!-- Pages icon -->
    <button class="switch-btn" id="caseIcon" title="Case Studies">
      <svg viewBox="0 0 24 24">
        <path d="M3 4H21V20H3V4ZM5 6V18H19V6H5ZM7 8H17V10H7V8ZM7 12H17V14H7V12Z"/>
      </svg>
    </button>
    <!-- Person icon -->
    <button class="switch-btn" id="aboutIcon" title="About">
      <svg viewBox="0 0 24 24">
        <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM12 14C8.13 14 2 16.17 2 20V22H22V20C22 16.17 15.87 14 12 14Z"/>
      </svg>
    </button>
  </div>
</div>

<script>
// ---------- Type Effect ----------
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");
function type(){if(c<lines[l].length){intro.textContent+=lines[l][c++];setTimeout(type,90);}else{if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,500);}}}
function erase(){if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}else{l++;type();}}
function showWelcome(){document.getElementById("hero").remove();const w=document.getElementById("welcome");w.style.opacity=1;document.getElementById("iconToggle").style.display="none";}
window.onload=type;

// ---------- Page System ----------
let currentPage=null;
const focus=document.getElementById("focus");
const iconToggle=document.getElementById("iconToggle");
const switchFocus=document.getElementById("switchFocus");

function createPage(title){
 if(currentPage) currentPage.remove();
 const p=document.createElement("section");p.className="page";document.body.appendChild(p);setTimeout(()=>p.style.transform="translateX(0)",50);

 if(title==="Case Studies"||title==="About"){iconToggle.style.display="block";}else{iconToggle.style.display="none";}

 const pageText=document.createElement("div");pageText.className="page-text";pageText.textContent=title;p.appendChild(pageText);

 if(title==="Case Studies"){addCarousel(pageText);switchFocus.style.transform="translateY(0)";}
 if(title==="About"){switchFocus.style.transform="translateY(100%)";}
}

function firstTransition(){document.getElementById("welcome").remove();document.body.style.background="#111";}
document.getElementById("caseBtn").onclick=()=>{focus.style.transform="translateX(0)";firstTransition();createPage("Case Studies");}
document.getElementById("aboutBtn").onclick=()=>{focus.style.transform="translateX(100%)";firstTransition();createPage("About");}
document.getElementById("caseIcon").onclick=()=>{createPage("Case Studies");}
document.getElementById("aboutIcon").onclick=()=>{createPage("About");}

// ---------- Carousel ----------
function addCarousel(textElement){
  const carousel=document.createElement("div");carousel.className="carousel";carousel.innerHTML=`
    <div class="carousel-track">
      <div class="carousel-item">Project 1</div>
      <div class="carousel-item">Project 2</div>
      <div class="carousel-item">Project 3</div>
    </div>
    <div class="carousel-nav">
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>`;textElement.appendChild(carousel);

  const track=carousel.querySelector(".carousel-track");
  const items=carousel.querySelectorAll(".carousel-item");let index=0;
  textElement.addEventListener("mouseenter",()=>{carousel.style.display="block";});
  textElement.addEventListener("mouseleave",()=>{carousel.style.display="none";});
  const prev=carousel.querySelector(".prev");const next=carousel.querySelector(".next");
  prev.onclick=()=>{index=(index-1+items.length)%items.length;track.style.transform=`translateX(-${index*100}%)`;}
  next.onclick=()=>{index=(index+1)%items.length;track.style.transform=`translateX(-${index*100}%)`;}
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sulphur Point',sans-serif;overflow:hidden;}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;color:#fff}

/* INTRO */
#intro{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:5;}
#introTextWrapper{display:flex;align-items:center;font-size:clamp(2.2rem,6vw,4.4rem);}
.cursor{width:2px;height:1em;background:#111;margin-left:6px;animation:blink .7s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* WELCOME */
#welcome{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;opacity:0;transition:.8s ease;}
#welcome div{margin-bottom:30px;font-size:clamp(3rem,6vw,5rem);}

/* PAGE */
.page{position:absolute;inset:0;background:#111;display:flex;justify-content:center;align-items:center;transform:translateX(100%);transition:.8s cubic-bezier(.77,0,.18,1);}

/* CASE TITLE */
#caseTitle{
  font-size:clamp(3rem,6vw,5rem);
  position:relative;
  z-index:2;
  transition:opacity .4s ease;
  cursor:pointer;
}

/* ROW GRID */
#hoverGrid{
  position:absolute;
  display:flex;
  gap:14px;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
}

.row{
  height:260px;
  width:60px;
  border-radius:14px;
  transition:background .3s ease;
}

/* COLORS */
.row:nth-child(1){background:#e63946;}
.row:nth-child(2){background:#f4a261;}
.row:nth-child(3){background:#2a9d8f;}
.row:nth-child(4){background:#457b9d;}
.row:nth-child(5){background:#9b5de5;}
.row:nth-child(6){background:#ff006e;}

.showRows #hoverGrid{opacity:1;pointer-events:auto;}
.showRows #caseTitle{opacity:0;}

</style>
</head>
<body class="grey-bg">

<!-- INTRO -->
<section id="intro">
  <div id="introTextWrapper">
    <span id="introText"></span>
    <span class="cursor"></span>
  </div>
</section>

<!-- WELCOME -->
<section id="welcome">
  <div>Welcome to my portfolio</div>
</section>

<!-- CASE PAGE -->
<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>

  <div id="hoverGrid">
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row"></div>
  </div>
</section>

<script>
/* TYPING INTRO */
const introText=document.getElementById("introText");
const welcome=document.getElementById("welcome");
const lines=["Hi there, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type(){
  if(c<lines[l].length){
    introText.textContent+=lines[l][c++];
    setTimeout(type,80);
  }else{
    if(l<lines.length-1){setTimeout(erase,600);}
    else{setTimeout(showWelcome,800);}
  }
}
function erase(){
  if(c>0){
    introText.textContent=lines[l].substring(0,--c);
    setTimeout(erase,40);
  }else{l++;type();}
}
function showWelcome(){
  intro.style.opacity=0;
  setTimeout(()=>{intro.remove();welcome.style.opacity=1;},600);
}
type();

/* SHOW CASE PAGE AFTER CLICK */
welcome.onclick=()=>{
  document.body.classList.remove("grey-bg");
  document.body.classList.add("black-bg");
  document.getElementById("case").style.transform="translateX(0)";
};

/* ROW HOVER LOGIC */
const caseSection=document.getElementById("case");
const grid=document.getElementById("hoverGrid");
const rows=[...grid.children];
const title=document.getElementById("caseTitle");

title.addEventListener("mouseenter",()=>caseSection.classList.add("showRows"));
grid.addEventListener("mouseleave",()=>caseSection.classList.remove("showRows"));

/* SMOOTH LERP ANIMATION */
const ease=0.12;
const baseWidth=60;
const maxExtra=220;
const sizes=rows.map(()=>baseWidth);

function animate(){
  rows.forEach((row,i)=>{
    const current=sizes[i];
    const target=row.targetWidth??baseWidth;
    sizes[i]=current+(target-current)*ease;
    row.style.width=sizes[i]+"px";
  });
  requestAnimationFrame(animate);
}

grid.addEventListener("mousemove",e=>{
  rows.forEach(r=>r.targetWidth=baseWidth);
  rows.forEach(row=>{
    const rect=row.getBoundingClientRect();
    const center=rect.left+rect.width/2;
    const distance=Math.abs(e.clientX-center);
    const influence=320;
    const extra=Math.max(0,influence-distance)/influence*maxExtra;
    row.targetWidth=baseWidth+extra;
  });
});

grid.addEventListener("mouseleave",()=>{
  rows.forEach(r=>r.targetWidth=baseWidth);
});

animate();
</script>
</body>
</html>

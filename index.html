<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:'Sulphur Point',sans-serif;background:#e6e6e6;}

/* ---------- Intro Typing ---------- */
#hero{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;}
#intro{font-size:clamp(2rem,6vw,4.2rem);border-right:2px solid #111;animation:blink .7s step-end infinite;}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- Welcome ---------- */
.welcome{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:50px;opacity:0;transition:transform 0.8s ease;}
.welcome-text{font-size:clamp(2.2rem,6vw,4.4rem);text-align:center;}

/* ---------- Welcome toggle (centered vertical icons) ---------- */
.welcome-toggle{display:flex;flex-direction:column;gap:20px;}
.welcome-toggle button{width:70px;height:70px;border-radius:50%;border:2px solid #fff;background:#111;color:#fff;font-size:1.5rem;cursor:pointer;transition:all 0.3s;}
.welcome-toggle button:hover{transform:scale(1.1);}

/* ---------- Case/About page toggle (right-center vertical) ---------- */
.iconToggle{position:fixed;right:30px;top:50%;transform:translateY(-50%);z-index:2000;display:none;}
.switch{width:70px;height:150px;background:#fff;border-radius:45px;display:grid;grid-template-rows:1fr 1fr;position:relative;overflow:hidden;border:2px solid #fff;}
.switch-focus{position:absolute;top:0;left:0;width:100%;height:50%;background:#000;border-radius:45px;transition:transform 0.3s ease;z-index:0;}
.switch-btn{border:none;background:transparent;color:black;display:flex;align-items:center;justify-content:center;z-index:1;cursor:pointer;transition:color 0.3s;}
.switch-btn svg{width:32px;height:32px;fill:black;transition:fill 0.3s;}
.switch-btn.active svg{fill:white;}

/* ---------- Pages ---------- */
.page{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#111;color:#fff;font-size:clamp(2rem,6vw,4rem);z-index:1000;transition:transform 0.8s ease;}
.page-horizontal{transform:translateX(100%);}
.page-horizontal.show{transform:translateX(0);}
.page-vertical{transform:translateY(100%);}
.page-vertical.show{transform:translateY(0);}
.page-text{cursor:pointer;color:#fff;font-size:2rem;margin-bottom:20px;position:relative;}

/* ---------- Carousel ---------- */
.carousel{display:none;margin-top:20px;width:90%;max-width:600px;overflow:hidden;border-radius:15px;position:relative;}
.carousel-track{display:flex;transition:transform 0.5s ease-in-out;}
.carousel-item{min-width:100%;flex-shrink:0;background:#222;color:#fff;font-size:1.5rem;display:flex;justify-content:center;align-items:center;height:200px;border-radius:10px;}
.carousel-nav{position:absolute;top:50%;width:100%;display:flex;justify-content:space-between;transform:translateY(-50%);padding:0 15px;}
.carousel-nav button{background:rgba(0,0,0,0.2);border:none;color:#fff;font-size:2rem;border-radius:50%;cursor:pointer;}

@media(max-width:600px){
  .iconToggle{right:15px;}.switch{width:55px;height:120px;}.switch-btn svg{width:24px;height:24px;}.carousel-item{height:150px;font-size:1.2rem;}
  .welcome-toggle button{width:55px;height:55px;font-size:1.2rem;}
}
</style>
</head>
<body>

<!-- Phase 1: Intro -->
<section id="hero"><div id="intro"></div></section>

<!-- Phase 2: Welcome -->
<section class="welcome" id="welcome">
  <div class="welcome-text">Welcome to my portfolio</div>
  <div class="welcome-toggle">
    <button id="welcomeCaseIcon" title="Case Studies">📄</button>
    <button id="welcomeAboutIcon" title="About">👤</button>
  </div>
</section>

<!-- Phase 3: Case/About page toggle -->
<div class="iconToggle" id="iconToggle">
  <div class="switch">
    <div class="switch-focus" id="switchFocus"></div>
    <button class="switch-btn" id="caseIcon" title="Case Studies">
      <svg viewBox="0 0 24 24"><path d="M3 4H21V20H3V4ZM5 6V18H19V6H5ZM7 8H17V10H7V8ZM7 12H17V14H7V12Z"/></svg>
    </button>
    <button class="switch-btn" id="aboutIcon" title="About">
      <svg viewBox="0 0 24 24"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM12 14C8.13 14 2 16.17 2 20V22H22V20C22 16.17 15.87 14 12 14Z"/></svg>
    </button>
  </div>
</div>

<script>
// ---------- Typing Intro ----------
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");
function type(){if(c<lines[l].length){intro.textContent+=lines[l][c++];setTimeout(type,90);}else{if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,500);}}}
function erase(){if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}else{l++;type();}}
function showWelcome(){
  document.getElementById("hero").remove();
  const welcome=document.getElementById("welcome");
  welcome.style.opacity=1;
}

// ---------- Welcome toggle ----------
const wCase=document.getElementById("welcomeCaseIcon");
const wAbout=document.getElementById("welcomeAboutIcon");
wCase.onclick=()=>transitionFromWelcome("Case Studies");
wAbout.onclick=()=>transitionFromWelcome("About");

function transitionFromWelcome(target){
  const welcome=document.getElementById("welcome");
  welcome.style.transform="translateY(-100%)";
  setTimeout(()=>{
    welcome.remove();
    document.body.style.background="#111";
    createPage(target,"vertical");
  },800);
}

// ---------- Page system ----------
let currentPage=null;
const iconToggle=document.getElementById("iconToggle");
const switchFocus=document.getElementById("switchFocus");
const caseIcon=document.getElementById("caseIcon");
const aboutIcon=document.getElementById("aboutIcon");

function setActiveToggle(active){
  if(active==="case"){switchFocus.style.transform="translateY(0)";caseIcon.classList.add("active");aboutIcon.classList.remove("active");}
  else{switchFocus.style.transform="translateY(100%)";caseIcon.classList.remove("active");aboutIcon.classList.add("active");}
}

function createPage(title,transitionType="horizontal"){
  if(currentPage) currentPage.remove();
  const p=document.createElement("section");
  p.className="page "+(transitionType==="horizontal"?"page-horizontal":"page-vertical");
  document.body.appendChild(p);
  setTimeout(()=>p.classList.add("show"),50);

  const pageText=document.createElement("div");
  pageText.className="page-text";
  pageText.textContent=title;
  p.appendChild(pageText);

  if(title==="Case Studies"){addCarousel(pageText);setActiveToggle("case");iconToggle.style.display="block";}
  if(title==="About"){setActiveToggle("about");iconToggle.style.display="block";}
}

// ---------- Case/About toggle click ----------
caseIcon.onclick=()=>{createPage("Case Studies","horizontal");}
aboutIcon.onclick=()=>{createPage("About","horizontal");}

// ---------- Carousel ----------
function addCarousel(textElement){
  const carousel=document.createElement("div");carousel.className="carousel";carousel.innerHTML=`
    <div class="carousel-track">
      <div class="carousel-item">Project 1</div>
      <div class="carousel-item">Project 2</div>
      <div class="carousel-item">Project 3</div>
    </div>
    <div class="carousel-nav">
      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>
    </div>`;textElement.appendChild(carousel);

  const track=carousel.querySelector(".carousel-track");
  const items=carousel.querySelectorAll(".carousel-item");let index=0;
  textElement.addEventListener("mouseenter",()=>{carousel.style.display="block";});
  textElement.addEventListener("mouseleave",()=>{carousel.style.display="none";});
  const prev=carousel.querySelector(".prev");const next=carousel.querySelector(".next");
  prev.onclick=()=>{index=(index-1+items.length)%items.length;track.style.transform=`translateX(-${index*100}%)`;}
  next.onclick=()=>{index=(index+1)%items.length;track.style.transform=`translateX(-${index*100}%)`;}
}
</script>
</body>
</html>

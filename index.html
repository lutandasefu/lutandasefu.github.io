<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@100&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
#intro{
  font-size:4.5rem;
  border-right:2px solid #111;
  white-space:nowrap;
  animation:blink .7s step-end infinite;
}
@keyframes blink{0%,50%,100%{border-color:#111;}25%,75%{border-color:transparent;}}

/* PERSISTENT NAV */
.nav{
  position:fixed;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
}

.toggle{
  position:relative;
  width:420px;
  height:60px;
  background:#fff;
  border-radius:60px;
  border:2px solid #111;
  font-family:'Urbanist',sans-serif;
  font-weight:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  cursor:pointer;
  overflow:hidden;
}

.toggle span{
  z-index:2;
  font-size:1.1rem;
}

.slider{
  position:absolute;
  height:100%;
  width:50%;
  background:#111;
  border-radius:60px;
  left:0;
  transition:transform .6s cubic-bezier(.77,0,.18,1);
  z-index:1;
}

.toggle.active .slider{
  transform:translateX(100%);
}

.toggle span{
  color:#111;
  transition:color .4s ease;
}

.toggle.active span:first-child{
  color:#111;
}
.toggle.active span:last-child{
  color:#fff;
}
.toggle span:first-child{
  color:#fff;
}
.toggle span:last-child{
  color:#111;
}

/* PAGE */
.page{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:4rem;
  transition:background .6s ease,color .6s ease;
}

.light{background:#e6e6e6;color:#111;}
.dark{background:#111;color:#fff;}

/* CURTAIN */
.curtain{
  position:fixed;
  inset:0;
  background:#111;
  transform:translateY(-100%);
  z-index:1500;
  transition:transform .8s ease;
}

@media(max-width:768px){
  #intro{font-size:2.5rem;}
  .toggle{width:300px;height:50px;font-size:.9rem;}
}
</style>
</head>
<body>

<div class="nav">
  <div class="toggle" id="toggle">
    <div class="slider"></div>
    <span>Case Studies</span>
    <span>About</span>
  </div>
</div>

<section class="hero" id="hero">
  <div id="intro"></div>
</section>

<div class="curtain" id="curtain"></div>

<script>
/* TYPE INTRO */
const sentences=[
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];
let s=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<sentences[s].length){
   intro.textContent+=sentences[s][c++];
   setTimeout(type,90);
 }else{
   if(s<sentences.length-1){
     setTimeout(erase,600);
   }else{
     setTimeout(showWelcome,800);
   }
 }
}
function erase(){
 if(c>0){
   intro.textContent=sentences[s].substring(0,--c);
   setTimeout(erase,40);
 }else{s++;type();}
}

/* PAGE SYSTEM */
let currentPage=null;

function createPage(title,mode){
 if(currentPage) currentPage.remove();
 const page=document.createElement("section");
 page.className=`page ${mode}`;
 page.innerHTML=`${title}`;
 document.body.appendChild(page);
 currentPage=page;
}

/* SHOW FIRST PAGE */
function showWelcome(){
 document.getElementById("hero").remove();
 createPage("Welcome to my portfolio","light");
}

/* TOGGLE NAVIGATION */
const toggle=document.getElementById("toggle");
const curtain=document.getElementById("curtain");

toggle.addEventListener("click",()=>{
  toggle.classList.toggle("active");

  curtain.style.transform="translateY(0%)";

  setTimeout(()=>{
    if(toggle.classList.contains("active")){
      createPage("About","dark");
    }else{
      createPage("Case Studies","dark");
    }
  },800);
});

window.onload=type;
</script>

</body>
</html>

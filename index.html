<!-- Welcome Page -->
<section id="welcome">
  <div class="welcome-text">Welcome to my portfolio</div>
  <div class="welcome-switch">
    <div class="welcome-focus" id="welcomeFocus"></div>
    <button id="welcomeCaseIcon">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 4H21V20H3V4ZM5 6V18H19V6H5ZM7 8H17V10H7V8ZM7 12H17V14H7V12Z"/></svg>
    </button>
    <button id="welcomeAboutIcon">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12ZM12 14C8.13 14 2 16.17 2 20V22H22V20C22 16.17 15.87 14 12 14Z"/></svg>
    </button>
  </div>
</section>

<style>
/* Welcome Toggle Styles */
.welcome-switch{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-top:30px;
  width:160px;
  height:60px;
  background:#fff;
  border-radius:50px;
  border:2px solid #fff;
}

.welcome-focus{
  position:absolute;
  top:5px;
  left:5px;
  width:70px;
  height:50px;
  background:#111;
  border-radius:50px;
  transition:transform 0.3s;
}

.welcome-switch button{
  flex:1;
  border:none;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:black;
  transition:color 0.3s;
  z-index:1;
}

.welcome-switch button svg path{
  fill:currentColor;
  transition:fill 0.3s;
}

.welcome-switch button.active{
  color:white;
}

</style>

<script>
const wCase=document.getElementById("welcomeCaseIcon");
const wAbout=document.getElementById("welcomeAboutIcon");
const welcomeFocus=document.getElementById("welcomeFocus");

function setActiveWelcome(btn){
  if(btn===wCase){
    welcomeFocus.style.transform="translateX(0)";
    wCase.classList.add("active");
    wAbout.classList.remove("active");
  } else {
    welcomeFocus.style.transform="translateX(100%)";
    wAbout.classList.add("active");
    wCase.classList.remove("active");
  }
}

wCase.onclick=()=>setActiveWelcome(wCase);
wAbout.onclick=()=>setActiveWelcome(wAbout);
</script>

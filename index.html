<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Sulphur Point',sans-serif;
  overflow:hidden;
  background:#e6e6e6;
  color:#111;
}

/* HERO TYPING */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
#intro{
  font-size:4.5rem;
  border-right:2px solid #111;
  white-space:nowrap;
  animation:blink .7s step-end infinite;
}
@keyframes blink{0%,50%,100%{border-color:#111;}25%,75%{border-color:transparent;}}

/* PAGE AREA */
.page{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
  background:#e6e6e6;
}

/* CURTAIN */
.curtain{
  position:fixed;
  inset:0;
  background:#111;
  transform:translateY(-100%);
  z-index:100;
}

/* TOGGLE MENU */
.menu{
  position:absolute;
  top:40px;
  display:flex;
  align-items:center;
  gap:20px;
  font-size:1.4rem;
}
.switch{
  position:relative;
  width:80px;
  height:40px;
}
.switch input{display:none;}
.slider{
  position:absolute;
  inset:0;
  background:#111;
  border-radius:50px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:34px;
  height:34px;
  left:3px;
  top:3px;
  background:#e6e6e6;
  border-radius:50%;
  transition:.4s;
}
input:checked + .slider:before{
  transform:translateX(40px);
}

/* HEADINGS */
h2{
  font-size:4rem;
  margin-top:120px;
}

/* RESPONSIVE */
@media(max-width:768px){
  #intro{font-size:2.5rem;}
  h2{font-size:2.5rem;}
  .menu{font-size:1rem;}
}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero" id="hero">
  <div id="intro"></div>
</section>

<!-- CURTAIN -->
<div class="curtain" id="curtain"></div>

<script>
/* ---------------- TYPING INTRO ---------------- */
const sentences=[
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];
let s=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<sentences[s].length){
   intro.textContent+=sentences[s][c++];
   setTimeout(type,90);
 }else{
   if(s<sentences.length-1){
     setTimeout(erase,600);
   }else{
     setTimeout(showWelcome,800);
   }
 }
}
function erase(){
 if(c>0){
   intro.textContent=sentences[s].substring(0,--c);
   setTimeout(erase,40);
 }else{s++;type();}
}

/* ---------------- WELCOME PAGE ---------------- */
function showWelcome(){
 document.getElementById("hero").remove();
 createPage("Welcome to my portfolio");
}

/* ---------------- PAGE CREATOR ---------------- */
function createPage(title){
 const page=document.createElement("section");
 page.className="page";
 page.innerHTML=`
   <div class="menu">
     <span>Case Studies</span>
     <label class="switch">
       <input type="checkbox" id="navToggle">
       <span class="slider"></span>
     </label>
     <span>About</span>
   </div>
   <h2>${title}</h2>
 `;
 document.body.appendChild(page);

 const toggle=page.querySelector("#navToggle");
 toggle.addEventListener("change",handleToggle);
}

/* ---------------- CURTAIN TRANSITION ---------------- */
function handleToggle(e){
 const curtain=document.getElementById("curtain");
 curtain.style.transition="transform 0.8s ease";
 curtain.style.transform="translateY(0%)";

 setTimeout(()=>{
   document.querySelector(".page").remove();

   if(e.target.checked){
     createPage("About");
   }else{
     createPage("Case Studies");
   }

   curtain.style.transform="translateY(-100%)";
 },800);
}

window.onload=type;
</script>

</body>
</html>

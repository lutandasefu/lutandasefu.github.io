<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertical Opposite Slide</title>
<style>
  body {
    margin: 0;
    font-family: 'Urbanist', sans-serif;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  .slide-container {
    position: relative;
    display: flex;
    gap: 4rem;
    font-size: clamp(3rem, 8vw, 8rem);
    font-weight: 700;
    height: 100vh; /* full height for vertical sliding */
    align-items: center;
  }

  .word-wrapper {
    position: relative;
    overflow: hidden;
    height: 1em;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .word-wrapper span {
    display: inline-block;
    transform: translateY(0);
    transition: transform 2s cubic-bezier(.22,1,.36,1);
    white-space: nowrap;
  }

  .interactive span {
    transform: translateY(-120vh); /* start well above screen */
  }

  .development span {
    transform: translateY(120vh); /* start well below screen */
  }

  .gradient {
    background: linear-gradient(90deg,#00f0ff,#ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Slide-in active class */
  .slide-in .interactive span {
    transform: translateY(0);
  }

  .slide-in .development span {
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="slide-container" id="slideContainer">
  <div class="word-wrapper interactive"><span class="gradient">Interactive</span></div>
  <div class="word-wrapper development"><span>Development</span></div>
</div>

<script>
  const container = document.getElementById('slideContainer');

  setTimeout(() => {
    container.classList.add('slide-in');
  }, 500);
</script>

</body>
</html>

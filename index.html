<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar with Black Background</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    /* === Black Background === */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000; /* Black background */
      font-family: "Inter", sans-serif;
    }

    /* === Navbar Styles === */
    .navbar {
      border-radius: 32px;
      background-color: rgba(255, 255, 255, 0.85);
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 10px 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    .list-item {
      list-style: none;
      flex-basis: 100%;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #555;
      transform: translateY(0);
      transition: transform 0.5s ease, color 0.2s ease;
      cursor: pointer;
    }

    .list-item-name {
      font-size: 13px;
      font-weight: 500;
      position: absolute;
      transform: translateY(50px);
      transition: transform 0.5s ease, opacity 0.2s ease;
      opacity: 0;
    }

    .list-item:hover {
      color: #5756e6;
      transform: translateY(-6px);
    }

    .list-item:hover .list-item-name {
      transform: translateY(20px);
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <li class="list-item"><i class="fa-solid fa-house"></i>
      <span class="list-item-name">Home</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-user"></i>
      <span class="list-item-name">Profile</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-gear"></i>
      <span class="list-item-name">Settings</span>
    </li>
    <li class="list-item"><i class="fa-solid fa-bag-shopping"></i>
      <span class="list-item-name">Bag</span>
    </li>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
  scroll-behavior:smooth;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position: relative;
  background: #ddd;
  transition: opacity 1.2s ease;
}

.hero.fade-out{
  opacity:0;
}

/* Typed intro */
h1{
  font-size:5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
  transition:opacity 1s ease, transform 1s ease;
}

.typing{animation:blink .7s step-end infinite;}
.cursor-end{animation:blink .7s step-end 3;}

@keyframes blink{
  0%,50%,100%{border-color:#333;}
  25%,75%{border-color:transparent;}
}

/* NEXT SECTION */
.next{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#ddd;
  opacity:0;
  transition:opacity 1.2s ease;
}

.next.show{
  opacity:1;
}

/* Welcome heading */
.next h2{
  font-size:4rem;
  font-weight:300;
  margin-bottom:50px;
  text-align:center;
}

/* CODEPEN MENU STYLES */
#app {
  width: 300px;
  height: 70px;
  display: grid;
  place-items: center;
}

#app ul {
  position: relative;
  width: 100%;
  height: 70px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-radius: 45px;
  background: rgba(255, 255, 255, 0.65);
  transform-origin: center center;
  transform: perspective(1000px);
  overflow: hidden;
}

#app li {
  list-style: none;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  font-family: 'Sulphur Point', sans-serif;
  font-weight: 500;
  text-transform: capitalize;
  color: #1355f6;
  z-index: 10;
  cursor: pointer;
}

.focus-el {
  position: absolute;
  left: 0;
  top: 0;
  width: 50%;
  height: 100%;
  border-radius: 45px;
  background: #fff;
  transition: left 0.75s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

.support{
  position: absolute;
  right: 10px;
  bottom: 10px;
  padding: 10px;
  display: flex;
}

.support a{
  margin: 0 10px;
  color: #fffdf9;
  font-size: 1.8rem;
  backface-visibility: hidden;
  transition: all 150ms ease;
}

.support a:hover{
  transform: scale(1.1);
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences = [
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro = document.getElementById("intro");
const hero = document.getElementById("hero");
let s=0,c=0;

function rand(){return 110+Math.random()*40;}

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 } else {
  if(s<sentences.length-1){
    setTimeout(erase,1400);
  } else {
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(()=>{
      intro.classList.add("fade-up");
      setTimeout(()=>{
        fadeHero();
      },2100);
    },2100);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 } else {
  s++;
  setTimeout(type,rand());
 }
}

function fadeHero(){
  hero.classList.add("fade-out");

  // NEXT SECTION
  const next = document.createElement("section");
  next.className="next";
  next.innerHTML = `
    <h2>Welcome to my portfolio</h2>
    <div id="app">
      <ul>
        <li>Photo</li>
        <li>Video</li>
        <span class="focus-el"></span>
      </ul>
    </div>
    <div class="support">
      <a href="https://twitter.com/DevLoop01" target="_blank"><i class="fab fa-twitter-square"></i></a>
      <a href="https://dribbble.com/devloop01" target="_blank"><i class="fab fa-dribbble"></i></a>
    </div>
  `;
  document.body.appendChild(next);

  // show next section after fade
  setTimeout(()=>next.classList.add("show"),800);

  // allow scrolling
  document.body.style.overflow="auto";

  // Menu toggle functionality
  const liContainer = next.querySelector("ul");
  const liEls = [...next.querySelectorAll("ul li")];
  const slideEl = next.querySelector(".focus-el");

  let liContainerRect = liContainer.getBoundingClientRect();
  let activeIndex = 0;

  liEls.forEach((li,index)=>{
    li.addEventListener("click",()=>{
      if(index === activeIndex) return;
      const x = index === 0 ? -1 : 1;
      activeIndex = index;
      const liRect = li.getBoundingClientRect();
      slideEl.style.left = `${liRect.left - liContainerRect.left}px`;
    });
  });
}

window.onload=type;
</script>

<!-- FontAwesome for social icons -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lutanda | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sulphur Point',sans-serif;overflow:hidden;}
body.grey-bg{background:#e6e6e6;}
body.black-bg{background:#111;}

/* ---------- INTRO ---------- */
#intro{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-size:clamp(2.2rem,6vw,4.4rem);
  text-align:center;
}
#introText { display:inline-block; }
.cursor {
  width:2px;
  height:1em;
  background:#111;
  display:inline-block;
  margin-left:6px;
  animation:blink 0.7s step-end infinite;
}
@keyframes blink{50%{opacity:0;}}

/* ---------- WELCOME ---------- */
#welcome{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:opacity .8s ease, transform .8s ease;
  z-index:4;
}
#welcomeText{margin-bottom:30px;font-size:clamp(2rem,5vw,3rem);color:#111;}

/* ---------- WELCOME TOGGLE ---------- */
#welcome-toggle{
  margin-top:40px;
  display:flex;
  position:relative;
  width:190px;
  height:60px;
  background:#fff;
  border-radius:50px;
  border:2px solid #fff;
}
#welcome-toggle .focus{
  position:absolute; top:6px; left:6px;
  width:78px; height:48px;
  border-radius:50px;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
#welcome-toggle button{
  flex:1;
  border:none;
  background:none;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
  padding:0 10px;
}
#welcome-toggle button svg{
  width:24px;
  height:24px;
  stroke:black;
  fill:none;
  transition:.3s;
}
#welcome-toggle button.active svg{stroke:white;}

/* ---------- RIGHT TOGGLE ---------- */
.right-toggle{
  position:fixed; right:30px; top:50%; transform:translateY(-50%);
  width:75px; height:160px; background:#fff;
  border-radius:45px; display:none; flex-direction:column;
  border:2px solid #fff; z-index:10;
}
.right-focus{
  position:absolute; top:0; left:0; width:100%; height:50%;
  background:#111;
  transition:transform .35s cubic-bezier(.77,0,.18,1);
}
.right-toggle button{
  flex:1; border:none; background:none; cursor:pointer;
  display:flex; justify-content:center; align-items:center; z-index:2;
}
.right-toggle button svg{
  width:28px; height:28px; stroke:black; fill:none; transition:.3s;
}
.right-toggle button.active svg{stroke:white;}

/* ---------- PAGES ---------- */
.page{
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:#111; color:white;
  transform:translateX(100%);
  transition:transform .8s cubic-bezier(.77,0,.18,1);
  z-index:3;
}

/* ---------- CAROUSEL ---------- */
.carousel{
  position:absolute; bottom:10%; width:80%; height:200px;
  opacity:0; transform:scale(.8); transition:.5s ease;
  display:flex; gap:20px; justify-content:center;
}
.carousel img{
  width:200px; height:120px; object-fit:cover; border-radius:12px;
}
.showCarousel{
  opacity:1; transform:scale(1);
}
</style>
</head>
<body class="grey-bg">

<!-- ---------- INTRO ---------- -->
<section id="intro">
  <span id="introText"></span><span class="cursor"></span>
</section>

<!-- ---------- WELCOME ---------- -->
<section id="welcome">
  <div id="welcomeText">Welcome to my portfolio</div>
  <div id="welcome-toggle">
    <div class="focus" id="wFocus"></div>
    <button id="toCase">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <rect x="3" y="4" width="14" height="14" rx="2"/>
        <path d="M7 8h6M7 12h6M7 16h4"/>
      </svg>
    </button>
    <button id="toAbout">
      <svg viewBox="0 0 24 24" stroke-width="1.5">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c2-4 14-4 16 0"/>
      </svg>
    </button>
  </div>
</section>

<!-- ---------- PAGES ---------- -->
<section id="case" class="page">
  <div id="caseTitle">Case Studies</div>
  <div class="carousel" id="carousel">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
  </div>
</section>

<section id="about" class="page">About</section>

<!-- ---------- RIGHT SIDEBAR ---------- -->
<div class="right-toggle" id="rightToggle">
  <div class="right-focus" id="rFocus"></div>
  <button id="caseBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <rect x="3" y="4" width="14" height="14" rx="2"/>
      <path d="M7 8h6M7 12h6M7 16h4"/>
    </svg>
  </button>
  <button id="aboutBtn">
    <svg viewBox="0 0 24 24" stroke-width="1.5">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c2-4 14-4 16 0"/>
    </svg>
  </button>
</div>

<script>
// ---------- TYPING INTRO ----------
const introText = document.getElementById("introText");
const cursor = document.querySelector(".cursor");
const lines = ["Hi there, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;

function type() {
  if(c < lines[l].length){
    introText.textContent += lines[l][c++];
    setTimeout(type, 80);
  } else {
    if(l < lines.length-1) setTimeout(erase, 600);
    else setTimeout(showWelcome, 800);
  }
}

function erase() {
  if(c > 0){
    introText.textContent = lines[l].substring(0,--c);
    setTimeout(erase,40);
  } else { l++; type(); }
}

function showWelcome() {
  introText.parentElement.style.opacity=0;
  setTimeout(()=>{
    introText.parentElement.remove();
    document.getElementById("welcome").style.opacity=1;
  },600);
}

type();

// ---------- NAVIGATION ----------
const wFocus = document.getElementById('wFocus');
const toCase = document.getElementById('toCase');
const toAbout = document.getElementById('toAbout');
const right = document.getElementById('rightToggle');
const rFocus = document.getElementById('rFocus');
const caseBtn = document.getElementById('caseBtn');
const aboutBtn = document.getElementById('aboutBtn');
const casePage = document.getElementById('case');
const aboutPage = document.getElementById('about');

function setActive(active,inactive){
  active.classList.add("active");
  inactive.classList.remove("active");
}

function activateBlackBg(){
  document.body.classList.remove("grey-bg");
  document.body.classList.add("black-bg");
}

function showCase(){
  activateBlackBg();
  casePage.style.transform="translateX(0)";
  aboutPage.style.transform="translateX(100%)";
  rFocus.style.transform="translateY(0)";
  setActive(caseBtn, aboutBtn);
}

function showAbout(){
  activateBlackBg();
  aboutPage.style.transform="translateX(0)";
  casePage.style.transform="translateX(-100%)";
  rFocus.style.transform="translateY(100%)";
  setActive(aboutBtn, caseBtn);
}

// Welcome toggle
toCase.onclick = () => {
  wFocus.style.transform="translateX(0)";
  document.getElementById("welcome").style.transform="translateY(-100%)";
  right.style.display="flex";
  showCase();
}
toAbout.onclick = () => {
  wFocus.style.transform="translateX(100%)";
  document.getElementById("welcome").style.transform="translateY(-100%)";
  right.style.display="flex";
  showAbout();
}

// Right toggle
caseBtn.onclick = showCase;
aboutBtn.onclick = showAbout;

// Carousel
const title = document.getElementById("caseTitle");
const carousel = document.getElementById("carousel");
title.onmouseenter = ()=>carousel.classList.add("showCarousel");
title.onmouseleave = ()=>carousel.classList.remove("showCarousel");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Urbanist:wght@100&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/6b8b2c6e52.js" crossorigin="anonymous"></script>

<style>
/* ---------- GLOBAL ---------- */
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#e6e6e6;font-family:'Sulphur Point',sans-serif;width:100%;height:100vh;}
section{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;}
#intro{font-size:4.2rem;border-right:2px solid #111;animation:blink .7s step-end infinite;}
@keyframes blink{50%{border-color:transparent;}}

/* ---------- WELCOME ---------- */
.welcome{flex-direction:column;gap:50px;font-size:3.8rem;opacity:0;transition:opacity .8s ease;}
.toggle{
  width:350px;height:60px;border-radius:60px;border:2px solid #111;background:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:0 40px;
  font-family:'Urbanist',sans-serif;font-weight:100;cursor:pointer;overflow:hidden;transition:all .7s cubic-bezier(.77,0,.18,1);z-index:2;position:relative;}
.toggle span{z-index:2;font-size:1.1rem;color:#111;}
.slider{
  position:absolute;height:100%;width:50%;background:#111;border-radius:60px;left:0;
  z-index:1;transition:transform .6s cubic-bezier(.77,0,.18,1);opacity:0;
} /* hidden initially */
.toggle.active .slider{opacity:1; transform:translateX(100%);} /* show slider on toggle active */
.toggle span:first-child{color:#fff;}
.toggle.active span:first-child{color:#111;}
.toggle span:last-child{color:#111;}
.toggle.active span:last-child{color:#fff;}

/* ---------- ICON MODE FOR DARK PAGES ---------- */
.iconMode{
  position:fixed;
  right:40px;
  top:50%;
  transform:translateY(-50%);
  width:70px;height:200px;
  flex-direction:column;
  padding:20px 0;
  background:#111;
  border:2px solid #fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:2001;
  transition:all .7s ease;
}
.iconMode .slider{width:100%;height:50%;transform:translateY(0%);background:#fff;}
.iconMode.active .slider{transform:translateY(100%);}
.iconMode span{font-size:1.6rem;color:#fff;display:flex;justify-content:center;align-items:center;}

/* ---------- PAGE ---------- */
.page{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;font-size:4rem;background:#111;color:#fff;z-index:1000;transform:translateX(100%);transition:transform .8s ease;}

/* ---------- CURTAIN ---------- */
.curtain{
  position:fixed;
  top:-100vh;
  left:0;
  width:100%;
  height:100vh;
  background:#111;
  transition:top .8s ease;
  z-index:900;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:768px){#intro{font-size:3rem;}.welcome{font-size:2.8rem;}.toggle{width:300px;}}
@media(max-width:480px){#intro{font-size:2.2rem;}.welcome{font-size:2rem;}.toggle{width:250px;padding:0 25px;}}
</style>
</head>
<body>

<!-- Typing page -->
<section class="hero" id="hero">
  <div id="intro"></div>
</section>

<!-- Welcome page -->
<section class="welcome" id="welcome">
  <div>Welcome to my portfolio</div>
  <div class="toggle" id="toggle">
    <div class="slider"></div>
    <span id="leftLabel">Case Studies</span>
    <span id="rightLabel">About</span>
  </div>
</section>

<div class="curtain" id="curtain"></div>

<script>
/* ---------- TYPE EFFECT ---------- */
const lines=["Hey, I'm Lutanda","A UI/UX designer","I design for clarity","And purpose."];
let l=0,c=0;
const intro=document.getElementById("intro");

function type(){
 if(c<lines[l].length){
   intro.textContent+=lines[l][c++];
   setTimeout(type,90);
 }else{
   if(l<lines.length-1){setTimeout(erase,600);}else{setTimeout(showWelcome,300);}
 }
}
function erase(){
 if(c>0){intro.textContent=lines[l].substring(0,--c);setTimeout(erase,40);}
 else{l++;type();}
}

/* ---------- SHOW WELCOME ---------- */
function showWelcome(){
 document.getElementById("hero").remove();
 document.getElementById("welcome").style.opacity=1;
}

/* ---------- PAGE SYSTEM ---------- */
let currentPage=null;
const toggle=document.getElementById("toggle");
const curtain=document.getElementById("curtain");
const leftLabel=document.getElementById("leftLabel");
const rightLabel=document.getElementById("rightLabel");

/* ---------- MORPH TO ICON MODE ---------- */
function toIconMode(){
 // move toggle to body so it's above pages
 document.body.appendChild(toggle);
 toggle.classList.add("iconMode");
 leftLabel.innerHTML='<i class="fa-solid fa-chart-line"></i>';
 rightLabel.innerHTML='<i class="fa-solid fa-user"></i>';
}

/* ---------- CREATE PAGE ---------- */
function createPage(title){
 if(currentPage) currentPage.remove();
 const p=document.createElement("section");
 p.className="page";
 p.textContent=title;
 document.body.appendChild(p);
 // slide in from right
 setTimeout(()=>{p.style.transform="translateX(0%)";},50);
 currentPage=p;
}

/* ---------- TOGGLE CLICK ---------- */
toggle.addEventListener("click",()=>{
  toggle.classList.toggle("active");

  // morph toggle first
  toIconMode();

  // curtain down
  curtain.style.top = '0';

  // after curtain animation, create new page and slide
  setTimeout(()=>{
    if(toggle.classList.contains("active")){
      createPage("About");
    }else{
      createPage("Case Studies");
    }
    // hide curtain after page slides in
    setTimeout(()=>{curtain.style.top='-100vh';},800);
  },600);
});

window.onload=type;
</script>

</body>
</html>

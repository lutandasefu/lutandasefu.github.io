<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lutanda | UI/UX Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Sulphur Point',sans-serif;
  background:#ddd;
  color:#333;
  overflow:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

h1{
  font-size:5rem;
  font-weight:300;
  border-right:2px solid #333;
  white-space:nowrap;
  transition:opacity 1s ease, transform 1s ease;
}

.fade-up{
  opacity:0;
  transform:translateY(-60px);
}

@keyframes blink{
  0%,50%,100%{border-color:#333;}
  25%,75%{border-color:transparent;}
}
.typing{animation:blink .7s step-end infinite;}
.cursor-end{animation:blink .7s step-end 3;}


/* UPDATED NAVBAR STYLE (inspired by CodePen colors/shadows) */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:90%;
  max-width:420px;
  background: #ffffff;
  border-radius: 32px;
  
  /* stronger shadow like CodePen panel cards */
  box-shadow: 0px 15px 25px rgba(0,0,0,0.15),
              0px 10px 10px rgba(0,0,0,0.12);
  
  padding: 0.5rem 1rem;
  gap: 0.5rem;

  font-family:"Inter",sans-serif;
  opacity:0;
  transition:opacity .6s ease;
}

.navbar.visible{
  opacity:1;
}

.list-item{
  list-style:none;
  flex:1;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  color:#555;
  cursor:pointer;
  font-size:1.1rem;
  transition: transform 0.4s ease, color 0.2s ease, text-shadow 0.2s ease;
}

.list-item-name{
  font-size:14px;
  font-weight:500;
  position:absolute;
  top:50px;
  opacity:0;
  transition:transform .5s ease,opacity .3s ease;
}

.list-item:hover{
  color:#5756e6;
  transform:translateY(-5px);
  text-shadow: 0px 2px 6px rgba(87,86,230,0.3);
}

.list-item:hover .list-item-name{
  transform:translateY(20px);
  opacity:1;
}

/* NEXT SECTION */
.next{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:2.5rem;
  background:#bbb;
  opacity:0;
  transform:translateY(80px);
  transition:opacity 1.2s cubic-bezier(.22,1,.36,1),
             transform 1.2s cubic-bezier(.22,1,.36,1);
}
.next.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>
<body>

<section class="hero" id="hero">
  <h1 id="intro" class="typing"></h1>
</section>

<script>
const sentences = [
 "Hey, I'm Lutanda",
 "A UI/UX designer",
 "I design for clarity",
 "And purpose."
];

const intro=document.getElementById("intro");
const hero=document.getElementById("hero");
let s=0,c=0;

function rand(){return 110+Math.random()*40;}

function type(){
 if(c<sentences[s].length){
  intro.textContent+=sentences[s][c++];
  setTimeout(type,rand());
 } else {
  if(s<sentences.length-1){
    setTimeout(erase,1400);
  } else {
    intro.classList.remove("typing");
    intro.classList.add("cursor-end");
    setTimeout(()=>{
      intro.classList.add("fade-up");
      setTimeout(buildNext,1000);
    },2100);
  }
 }
}

function erase(){
 if(c>0){
  intro.textContent=sentences[s].substring(0,--c);
  setTimeout(erase,60);
 } else {
  s++;
  setTimeout(type,rand());
 }
}

function buildNext(){
 document.body.style.overflow="auto";

 // CREATE NAVBAR (hidden by default)
 const nav=document.createElement("div");
 nav.className="navbar";
 nav.innerHTML=`
  <li class="list-item"><i class="fa-solid fa-house"></i><span class="list-item-name">Home</span></li>
  <li class="list-item"><i class="fa-solid fa-user"></i><span class="list-item-name">Profile</span></li>
  <li class="list-item"><i class="fa-solid fa-gear"></i><span class="list-item-name">Settings</span></li>
  <li class="list-item"><i class="fa-solid fa-bag-shopping"></i><span class="list-item-name">Bag</span></li>
 `;
 hero.appendChild(nav);

 // NEXT SECTION
 const next=document.createElement("section");
 next.className="next";
 next.innerText="Welcome to my portfolio";
 document.body.appendChild(next);

 setTimeout(()=>{
   window.scrollTo({ top: window.innerHeight, behavior: "smooth" });
   setTimeout(()=>next.classList.add("show"),400);
 },200);

 // Show navbar only when hero is in view
 window.addEventListener("scroll",()=>{
   if(window.scrollY < window.innerHeight - 80){
     nav.classList.add("visible");
   } else {
     nav.classList.remove("visible");
   }
 });
}

window.onload=type;
</script>

</body>
</html>

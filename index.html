<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lutanda | UI/UX Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sulphur+Point:wght@300&display=swap" rel="stylesheet">

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sulphur Point', sans-serif;
      background-color: #ddd; /* background */
      color: #333; /* text color */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    /* Typed text */
    h1 {
      font-size: 5rem;
      font-weight: 300;
      border-right: 2px solid #333; /* cursor */
      white-space: nowrap;
      overflow: hidden;
    }

    /* Blinking cursor */
    @keyframes blink {
      0%, 50%, 100% { border-color: #333; }
      25%, 75% { border-color: transparent; }
    }

    .typing {
      animation: blink 0.7s step-end infinite;
    }

    /* Fade out cursor at end */
    .cursor-fade {
      animation: blink-fade 1s forwards;
    }

    @keyframes blink-fade {
      from { border-color: #333; }
      to { border-color: transparent; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 { font-size: 4rem; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <h1 id="intro" class="typing"></h1>

  <script>
    const sentences = [
      "Hey, I'm Lutanda",
      "A UI/UX designer",
      "I design for clarity",
      "And purpose." // added period at the end
    ];

    const introEl = document.getElementById("intro");
    let sentenceIndex = 0;
    let charIndex = 0;

    const baseTypingSpeed = 120; // smoother typing
    const erasingSpeed = 70;     
    const delayBetween = 1500;

    function randomTypingSpeed() {
      return baseTypingSpeed + Math.random() * 50;
    }

    function typeSentence() {
      if (charIndex < sentences[sentenceIndex].length) {
        introEl.textContent += sentences[sentenceIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeSentence, randomTypingSpeed());
      } else {
        // last sentence check
        if (sentenceIndex < sentences.length - 1) {
          setTimeout(eraseSentence, delayBetween);
        } else {
          // last sentence finished: keep text with full stop, fade cursor
          introEl.classList.remove("typing");
          introEl.classList.add("cursor-fade");
        }
      }
    }

    function eraseSentence() {
      if (charIndex > 0) {
        introEl.textContent = sentences[sentenceIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseSentence, erasingSpeed);
      } else {
        sentenceIndex++;
        setTimeout(typeSentence, randomTypingSpeed());
      }
    }

    window.onload = () => typeSentence();
  </script>

</body>
</html>
